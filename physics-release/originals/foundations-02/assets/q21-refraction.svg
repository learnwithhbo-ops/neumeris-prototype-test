<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390"><title>Ray crossing into a block</title><desc>The ray angles to the surface are 60 degrees in air and 70 degrees in the transparent block. A dashed vertical line marks the normal.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="black"/></marker></defs><g fill="none" stroke="black" stroke-width="2"><path d="M40 185 H480"/><path d="M260 25 V370" stroke-dasharray="6 5"/><path d="M182 50 L260 185 L315 336"/><path d="M209 97 L225 125" marker-end="url(#arrow)"/><path d="M280 240 L291 271" marker-end="url(#arrow)"/><path d="M213 185 A47 47 0 0 1 236.5 144.3"/><path d="M307 185 A47 47 0 0 1 276.1 229.2"/></g><g font-family="Arial,sans-serif" font-size="19"><text x="192" y="161">60°</text><text x="322" y="235">70°</text><text x="380" y="150">air</text><text x="380" y="238">block</text><text x="278" y="39">normal</text></g></svg>
