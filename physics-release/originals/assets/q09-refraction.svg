<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="title desc"><title id="title">Incident light ray</title><desc id="desc">A flat boundary separates medium X above from medium Y below. A ray travels downwards and rightwards in X towards the boundary, at 40 degrees to the normal. No transmitted ray is shown.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="black"/></marker></defs><g fill="none" stroke="black" stroke-width="1.6"><path d="M45 150 H470"/><path stroke-dasharray="5 5" d="M250 35 V270"/><path marker-end="url(#arrow)" d="M149 30 L250 150"/><path d="M250 99 A51 51 0 0 0 217 111"/><text x="222" y="87" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">40°</text><text x="455" y="130" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">X</text><text x="455" y="180" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">Y</text><text x="267" y="39" text-anchor="start" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">normal</text></g></svg>
