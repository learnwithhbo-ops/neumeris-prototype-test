<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 325" role="img" aria-labelledby="title desc"><title id="title">Two pipe boundary conditions</title><desc id="desc">Tube A has an open left end and a movable piston closing its right end. Its air-column length is L a. Tube B is open at both ends and has length L b. No standing-wave patterns are drawn.</desc><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="black" stroke-width="1.6"><path d="M145 70 H420 M145 120 H420"/><rect x="380" y="70" width="12" height="50"/><path d="M392 95 H460"/><path d="M145 137 V152 M380 137 V152 M145 147 H380"/><text x="65" y="100" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">Tube A</text><text x="145" y="52" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">open</text><text x="389" y="52" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">piston</text><text x="262" y="171" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">Lₐ</text><path d="M145 215 H380 M145 255 H380"/><path d="M145 269 V284 M380 269 V284 M145 279 H380"/><text x="65" y="241" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">Tube B</text><text x="145" y="197" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">open</text><text x="380" y="197" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">open</text><text x="262" y="305" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">Lᵦ</text></g></svg>
