<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="title desc"><title id="title">Cable force and crate displacement</title><desc id="desc">A cable pulls at 60 degrees above the horizontal with force 30 newtons. The crate displacement is 4.0 metres horizontally rightwards.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="black"/></marker></defs><g fill="none" stroke="black" stroke-width="1.6"><rect x="170" y="180" width="90" height="60"/><path d="M65 241 H450"/><path marker-end="url(#arrow)" d="M240 180 L300 76"/><path stroke-dasharray="5 5" d="M240 180 H335"/><path d="M274 180 A34 34 0 0 0 257 150"/><path marker-end="url(#arrow)" d="M280 220 H430"/><text x="321" y="114" text-anchor="start" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">30 N</text><text x="286" y="151" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">60°</text><text x="362" y="209" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">4.0 m</text></g></svg>
