<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="title desc"><title id="title">Two forces on a ring</title><desc id="desc">Two of three forces on a ring in a horizontal plane. 6.0 newtons acts rightwards and 8.0 newtons acts upwards on the page.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="black"/></marker></defs><g fill="none" stroke="black" stroke-width="1.6"><circle cx="230" cy="190" r="10"/><path marker-end="url(#arrow)" d="M240 190 H330"/><path marker-end="url(#arrow)" d="M230 180 V60"/><text x="289" y="176" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">6.0 N</text><text x="250" y="110" text-anchor="start" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">8.0 N</text><text x="230" y="235" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">Top view</text></g></svg>
