<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="title desc"><title id="title">Robot velocity</title><desc id="desc">Velocity v in metres per second against time t in seconds. The line joins (0,3), (2,3), (4,-3) and (6,-3).</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="black"/></marker></defs><g fill="none" stroke="black" stroke-width="1.6"><path d="M75 145 H450 M75 250 V30"/><text x="470" y="150" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">t / s</text><text x="85" y="20" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">v / m s⁻¹</text><path d="M75 140 V150"/><text x="75" y="173" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">0</text><path d="M133 140 V150"/><text x="133" y="173" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">1</text><path d="M191 140 V150"/><text x="191" y="173" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">2</text><path d="M249 140 V150"/><text x="249" y="173" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">3</text><path d="M307 140 V150"/><text x="307" y="173" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">4</text><path d="M365 140 V150"/><text x="365" y="173" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">5</text><path d="M423 140 V150"/><text x="423" y="173" text-anchor="middle" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">6</text><path d="M70 235 H80"/><text x="58" y="240" text-anchor="end" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">-3</text><path d="M70 145 H80"/><text x="58" y="150" text-anchor="end" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">0</text><path d="M70 55 H80"/><text x="58" y="60" text-anchor="end" fill="black" stroke="none" font-family="Arial, sans-serif" font-size="16">3</text><path stroke-width="2.3" d="M75 55 H191 L307 235 H423"/><path stroke-dasharray="5 5" d="M191 55 V145 M307 145 V235 M423 145 V235"/></g></svg>
