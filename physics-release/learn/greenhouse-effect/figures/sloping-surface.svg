<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="725" viewBox="0 0 1200 725" role="img" aria-labelledby="title desc"><title id="title">Oblique illumination doubles the footprint at 60 degrees</title><desc id="desc">The beam widths are identical. The receiving segment at oblique incidence is exactly twice as long as the facing segment; the width into the page is common. The normal is perpendicular to the sloping receiver and makes 60 degrees with the direction towards the source.</desc><defs><radialGradient id="sphere" cx="27%" cy="30%" r="85%"><stop stop-color="#e0edf2"/><stop offset=".45" stop-color="#a8c2d2"/><stop offset="1" stop-color="#3d5668"/></radialGradient><linearGradient id="plate"><stop stop-color="#dce8ec"/><stop offset="1" stop-color="#819baa"/></linearGradient><linearGradient id="emission" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d99379"/><stop offset="1" stop-color="#bc5d45"/></linearGradient></defs><rect width="1200" height="725" fill="white"/><g font-family="Georgia, 'Times New Roman', serif"><text x="600" y="60" font-size="38" fill="#20323e" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3">The same beam meets two orientations</text><text x="280" y="125" font-size="31" fill="#20323e" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3">Normal incidence</text><text x="900" y="125" font-size="31" fill="#20323e" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3">Oblique incidence</text><path d="M65 235H395V415H65Z" fill="#f5ce6b" opacity=".22"/><path d="M640 235H744.115427318801L1055.884572681199 415H640Z" fill="#f5ce6b" opacity=".22"/><path d="M395 210H405V440H395Z" fill="url(#plate)" stroke="#20323e" stroke-width="2"/><path d="M735.4551732809566,230L1064.5448267190434,420l5 -8.660254L740.4551732809566 221.339746Z" fill="url(#plate)" stroke="#20323e" stroke-width="2"/><g data-facing-ray="0"><line x1="65" y1="235" x2="395" y2="235" stroke="#e5a421" st