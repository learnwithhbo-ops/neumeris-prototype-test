<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Emitted intensity at equal temperature</title><desc id="desc">Both surfaces are at 300 kelvin. The ideal bar is 650 units long, and the emissivity 0.80 bar is 520 units long, an exact 0.80 ratio. The corresponding emitted intensities round to 459.3 and 367.4 watts per square metre.</desc><defs><radialGradient id="sphere" cx="27%" cy="30%" r="85%"><stop stop-color="#e0edf2"/><stop offset=".45" stop-color="#a8c2d2"/><stop offset="1" stop-color="#3d5668"/></radialGradient><linearGradient id="plate"><stop stop-color="#dce8ec"/><stop offset="1" stop-color="#819baa"/></linearGradient><linearGradient id="emission" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d99379"/><stop offset="1" stop-color="#bc5d45"/></linearGradient></defs><rect width="1200" height="680" fill="white"/><g font-family="Georgia, 'Times New Roman', serif"><text x="600" y="65" font-size="36" fill="#20323e" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3">Compare at the same temperature: T = 300 K</text><text x="55" y="180" font-size="29" fill="#20323e" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3">Ideal black body</text><text x="55" y="221" font-size="31" fill="#20323e" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3">ε = 1</text><text x="55" y="330" font-size="29" fill="#20323e" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3">Real surface</text><text x="55" y="371" font-size="31" fill="#20323e" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3">ε = 0.80</text><rect data-bar="ideal" x="300" y="156" width="650" height="65" fill="url(#emission)"/><rect data-bar="real" x="300" y="306" width="520" height="65" fill="url(#emission)"/><text x="965" y="200" font-size="31" fill="#bc5d45" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3">459.3</text><text x="835" y="350" font-size="31" fill="#bc5d45" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3">367.4</text><line x1="300" y1="135" x2="300" y2="390" stroke="#556b7b" stroke-width="1.5" stroke-dasharray="6 6"/><line x1="300" y1="432" x2="950" y2="432" stroke="#20323e" stroke-width="2" /><line x1="300" y1="426" x2="300" y2="441" stroke="#20323e" stroke-width="1.5" /><text x="300" y="475" font-size="24" fill="#556b7b" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3">0</text><line x1="441.528948" y1="426" x2="441.528948" y2="441" stroke="#20323e" stroke-width="1.5" /><text x="441.52894811331026" y="475" font-size="24" fill="#556b7b" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3">100</text><line x1="583.057896" y1="426" x2="583.057896" y2="441" stroke="#20323e" stroke-width="1.5" /><text x="583.0578962266205" y="475" font-size="24" fill="#556b7b" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3">200</text><line x1="724.586844" y1="426" x2="724.586844" y2="441" stroke="#20323e" stroke-width="1.5" /><text x="724.5868443399308" y="475" font-size="24" fill="#556b7b" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3">300</text><line x1="866.115792" y1="426" x2="866.115792" y2="441" stroke="#20323e" stroke-width="1.5" /><text x="866.115792453241" y="475" font-size="24" fill="#556b7b" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3">400</text><line x1="950" y1="426" x2="950" y2="441" stroke="#20323e" stroke-width="1.5" /><text x="950" y="475" font-size="24" fill="#556b7b" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3">459.3</text><text x="625" y="520" font-size="30" fill="#20323e" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3">Emitted intensity / W m⁻²</text><text x="600" y="593" font-size="42" fill="#20323e" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3">I = εσT⁴</text><text x="600" y="645" font-size="26" fill="#556b7b" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3">At the same T, 80% of the emissivity gives 80% of the emission.</text></g></svg>
