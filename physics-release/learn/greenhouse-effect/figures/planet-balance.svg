<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="855" viewBox="0 0 1200 855" role="img" aria-labelledby="title desc"><title id="title">Balance powers over the correct areas</title><desc id="desc">Parallel sunlight spans the complete diameter. Its intercepted power is S pi R squared. A fraction alpha is reflected from the lit surface. Infrared leaves both hemispheres; a uniform-temperature planet emits over four pi R squared. The radius reaches the sphere boundary.</desc><defs><radialGradient id="sphere" cx="27%" cy="30%" r="85%"><stop stop-color="#e0edf2"/><stop offset=".45" stop-color="#a8c2d2"/><stop offset="1" stop-color="#3d5668"/></radialGradient><linearGradient id="plate"><stop stop-color="#dce8ec"/><stop offset="1" stop-color="#819baa"/></linearGradient><linearGradient id="emission" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d99379"/><stop offset="1" stop-color="#bc5d45"/></linearGradient></defs><rect width="1200" height="855" fill="white"/><g font-family="Georgia, 'Times New Roman', serif"><text x="60" y="80" font-size="32" fill="#e5a421" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3">Incident sunlight</text><text x="60" y="125" font-size="37" fill="#20323e" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3">SπR²</text><text x="365" y="65" font-size="30" fill="#357aa8" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3">Reflected sunlight</text><text x="410" y="110" font-size="34" fill="#20323e" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3">αSπR²</text><text x="870" y="65" font-size="30" fill="#bc5d45" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3">Thermal emission</text><text x="870" y="110" font-size="32" fill="#20323e" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3">εσT⁴ × 4πR²</text><g data-solar-ray="0"><line x1="60" y1="202" x2="816" y2="202" stroke="#e5a421" stroke-width="2.6" data-shaft="true"/><path d="M816 202L803 196.5L803 207.5Z" fill="#e5a421"/></g><g data-solar-ray="1"><line x1="60" y1="239" x2="552.107201" y2="239" stroke="#e5a421" stroke-width="2.6" data-shaft="true"/><path d="M552.107201 239L539.107201 233.5L539.107201 244.5Z" fill="#e5a421"/></g><g data-solar-ray="2"><line x1="60" y1="276" x2="521.82824" y2="276" stroke="#e5a421" stroke-width="2.6" data-shaft="true"/><path d="M521.82824 276L508.82824 270.5L508.82824 281.5Z" fill="#e5a421"/></g><g data-solar-ray="3"><line x1="60" y1="313" x2="506.699616" y2="313" stroke="#e5a421" stroke-width="2.6" data-shaft="true"/><path d="M506.699616 313L493.699616 307.5L493.699616 318.5Z" fill="#e5a421"/></g><g data-solar-ray="4"><line x1="60" y1="350" x2="502" y2="350" stroke="#e5a421" stroke-width="2.6" data-shaft="true"/><path d="M502 350L489 344.5L489 355.5Z" fill="#e5a421"/></g><g data-solar-ray="5"><line x1="60" y1="387" x2="506.699616" y2="387" stroke="#e5a421" stroke-width="2.6" data-shaft="true"/><path d="M506.699616 387L493.699616 381.5L493.699616 392.5Z" fill="#e5a421"/></g><g data-solar-ray="6"><line x1="60" y1="424" x2="521.82824" y2="424" stroke="#e5a421" stroke-width="2.6" data-shaft="true"/><path d="M521.82824 424L508.82824 418.5L508.82824 429.5Z" fill="#e5a421"/></g><g data-solar-ray="7"><line x1="60" y1="461" x2="552.107201" y2="461" stroke="#e5a421" stroke-width="2.6" data-shaft="true"/><path d="M552.107201 461L539.107201 455.5L539.107201 466.5Z" fill="#e5a421"/></g><g data-solar-ray="8"><line x1="60" y1="498" x2="816" y2="498" stroke="#e5a421" stroke-width="2.6" data-shaft="true"/><path d="M816 498L803 492.5L803 503.5Z" fill="#e5a421"/></g><circle data-planet="true" cx="650" cy="350" r="148" fill="url(#sphere)" stroke="#20323e" stroke-width="2.2"/><path d="M502 350A148 43 0 0 0 798 350" fill="none" stroke="#f1f5f7" stroke-width="1.5"/><path d="M502 350A148 43 0 0 1 798 350" fill="none" stroke="#506b7e" stroke-width="1.2" stroke-dasharray="6 6"/><ellipse c