/></g><line x1="650" y1="350" x2="771.234503" y2="265.110687" stroke="#20323e" stroke-width="2" data-radius="true"/><circle cx="650" cy="350" r="3.5" fill="#20323e"/><text x="715" y="323" font-size="31" fill="#20323e" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3">R</text><text x="650" y="395" font-size="38" fill="#20323e" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3">T</text><text x="888" y="300" font-size="29" fill="#556b7b" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3">Whole emitting</text><text x="888" y="340" font-size="31" fill="#556b7b" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3">surface: 4πR²</text><text x="60" y="570" font-size="31" fill="#218d91" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3">Absorbed solar power</text><text x="60" y="614" font-size="35" fill="#20323e" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3">(1 − α)SπR²</text><text x="887" y="488" font-size="27" fill="#556b7b" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3">Uniform temperature</text><text x="600" y="704" font-size="31" fill="#20323e" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3">At equilibrium: absorbed power = emitted power</text><text x="600" y="758" font-size="37" fill="#20323e" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3">(1 − α)SπR² = εσT⁴ × 4πR²</text><text x="600" y="818" font-size="25" fill="#556b7b" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3">No separate atmosphere · no other heat input</text></g></svg>
