schema_version: '1.2'
spec_intent:
  source_of_truth: true
  codex_role: implementation_only
  codex_must_not_invent:
  - mathematics
  - question wording
  - answers
  - Ryan dialogue
  - hints
  - worked solutions
  - animation storyboards
  - branching behaviour
  - mastery rules
  - lesson sequence
  allowed_engine_interpretation: <responsive implementation constraints only>
identity:
  id: <STRAND-CLUSTER-NN>
  slug: <kebab-case-slug>
  title: <student-facing skill title>
  strand: <Number|Algebra|Ratio Proportion Rates of Change|Geometry and Measures|Probability|Statistics>
  cluster: <cluster name>
  tier: GCSE Foundation
  status: draft
  estimated_minutes:
    min: 24
    max: 30
curriculum:
  basis: England GCSE Mathematics / national curriculum spine
  role: <direct_gcse_content|gcse_enabling_prerequisite>
  official_mapping:
    direct_gcse_refs: []
    supports_gcse_refs: []
    prior_curriculum_refs: []
  learning_objective: <one atomic objective>
  success_criteria:
  - <observable success criterion>
  boundaries:
    includes:
    - <included content>
    excludes:
    - <explicitly excluded neighbouring skill>
dependencies:
  required_skill_refs: []
  entry_assumptions:
  - <minimum learner assumption>
  downstream_rule: Do not store leads_to. Derive downstream relationships from other skills prerequisite references.
engine_capability_requirements:
  input_types: []
  visual_primitives: []
  animation_actions: []
  audio_capabilities:
  - queued_tts_or_audio
  - caption_sync
  - narration_animation_sync
  - pause_for_input
  - cancel_on_navigation
  state_capabilities:
  - attempt_count
  - step_resume
  - skill_state
  - diagnostic_evidence
  - exit_score
  - confirmation_branch
experience_contract:
  target_session_minutes:
    min: 24
    max: 30
  ordered_phases:
  - teaching
  - guided
  - faded
  - independent_transfer
  - practice
  - exit
  - completion
  navigation:
    default: linear_forward
    back_button: <exact behaviour>
    refresh_resume: <exact behaviour>
    start_again: <exact behaviour>
  global_ui_copy:
    submit: Check answer
    continue: Continue
    try_again: Try again
    show_me: Show me
    finish: Finish
    continue_learning: Continue learning
    stop_for_today: Finish for today
  progress_indicator:
    show: true
    student_facing_style: <description>
    do_not_show: <internal data hidden from learner>
  interaction_rules:
  - <exact interaction rule>
voice_and_script:
  performer_name: Ryan
  dialogue_profile_ref: RYAN_DIALOGUE_PROFILE_v1.yaml
  script_ownership: All lesson-specific mathematical speech is authored exactly in this skill file. Generic encouragement
    is authored exactly in the referenced Ryan profile. The engine selects; it never generates or paraphrases.
  delivery_style:
  - Natural UK English
  - Warm, conversational and encouraging
  - No one-word success reactions
  - No repeated praise lead-ins within a lesson attempt
  - No praise or mathematical conclusion repeated again at the start of the next scene
  success_reaction_policy:
    mode: engine_select_from_authored_profile
    generation_allowed: false
    selection_state_scope: lesson_attempt
    persist_selection_history_on_refresh_resume: true
    derive_context_from:
    - stage
    - attempt_count
    - recovery_status
    - practice_streak
    no_repeat:
    - reaction_id
    - exact_text
    - lead_family
    fallback_when_pool_exhausted: Speak only item-specific mathematical follow-up; never repeat or invent praise.
    diagnostic: silent
    exit_and_confirmation: silent_until_completion_result
  adjacent_speech_policy:
    after_success: Do not play a second generic acknowledgement before the next scene.
    next_scene: Begin directly with new mathematical content.
    semantic_echo: The next scene must not restate the same mathematical conclusion just delivered in success feedback.
    item_math_feedback: May follow the selected generic reaction only when it adds mathematical value.
  caption_policy: <exact caption rule>
visual_language:
  scene_rules:
    composition: <layout principle>
    labels: <label placement>
    motion: <motion principle>
    focus: <focus principle>
  semantic_roles:
  - <visual semantic role>
  style_direction:
  - <professional style rule>
  primary_visual_contract:
    <primitive_name>:
      <property>: <rule>
  animation_blueprint:
    setup: <exact starting layout and objects>
    transform: <exact mathematical motion/transformation>
    contrast: <exact counterexample or comparison animation>
    error: <exact visual response to the central error>
    summary: <exact final visual state and invariant>
  reduced_motion: <equivalent non-motion behaviour>
diagnostic:
  purpose: <what diagnostic evidence means>
  question_refs:
  - <SKILL-D01>
  - <SKILL-D02>
  presentation: <exact diagnostic UI/feedback behaviour>
  scoring:
    2_of_2: DIAGNOSTIC_SECURE
    0_or_1_of_2: NEEDS_WORK
  routing: Start at the earliest non-secure skill in prerequisite order.
concept_model:
  core_idea: <single conceptual sentence>
  invariant: <what stays mathematically unchanged>
  mathematical_rule: <rule once meaning is established>
  vocabulary: []
  must_notice: []
  common_confusions: []
lesson:
  teaching_steps:
  - id: T01
    stage: teaching
    purpose: <pedagogical purpose>
    estimated_seconds: 30
    scene:
      layout: <layout id/description>
      objects:
      - <object and exact starting representation>
      initial_state: <what the learner sees before narration>
    narration:
      script: <EXACT Ryan line>
      delivery: <tone, pace, pause, emphasis>
      sync_cues:
      - cue: <narration or scene cue>
        action: <animation action fired at cue>
    animation_timeline:
    - id: A01
      trigger: <trigger>
      action: <engine animation action>
      target: <visual object>
      from: <start state>
      to: <end state>
      duration_ms: 800
      easing: ease-in-out
      semantic_purpose: <what the motion teaches>
    learner_interaction:
      question_ref: <optional question ref>
      input_position: <placement>
      auto_focus: true
    branching:
      correct:
        ryan_script: <EXACT line>
        visual_action: <exact feedback animation>
        next_step: <id>
      incorrect_attempt_1:
        ryan_script: <EXACT line>
        visual_action: <exact mathematical focus>
        next_step: <retry or id>
      incorrect_attempt_2:
        ryan_script: <EXACT line>
        visual_action: <exact reveal/replay>
        next_step: <recovery item or id>
    next_step: <next id when non-interactive>
  transfer_steps:
    G01:
      stage: guided
      question_ref: <SKILL-G01>
      support_level: high
      estimated_seconds: 90
      pre_question_script: <EXACT Ryan line>
      visual_before_answer: <exact support visible>
      correct_next: F01
      recovery_ref: <SKILL-Rxx>
    F01:
      stage: faded
      question_ref: <SKILL-F01>
      support_level: reduced
      estimated_seconds: 100
      pre_question_script: <EXACT Ryan line>
      visual_before_answer: <exact reduced support>
      correct_next: I01
      recovery_ref: <SKILL-Rxx>
    I01:
      stage: independent_transfer
      question_ref: <SKILL-I01>
      support_level: none
      estimated_seconds: 110
      pre_question_script: <EXACT Ryan line>
      visual_before_answer: <no initial support>
      correct_next: P01
      recovery_ref: <SKILL-Rxx>
  practice:
    intro_script: <EXACT Ryan line>
    question_order:
    - <SKILL-P01>
    - <SKILL-P02>
    - <SKILL-P03>
    - <SKILL-P04>
    - <SKILL-P05>
    question_count: 5
    feedback_policy: <exact attempt/solution policy>
    between_question_transition: <exact reaction selection policy>
  exit:
    intro_script: <EXACT Ryan line>
    primary_question_refs:
    - <SKILL-E01>
    - <SKILL-E02>
    confirmation_question_refs:
    - <SKILL-E03>
    - <SKILL-E04>
    submission_policy: <exact no-hint behaviour>
    mastery_logic:
      2_correct_of_2: SECURE
      1_correct_of_2: <confirmation rule>
      0_correct_of_2: NEEDS_WORK
    confirmation_selection: <exact deterministic selection rule>
completion:
  secure:
    title: <student-facing title>
    ryan_script: <EXACT completion line>
    state_write: SECURE
    buttons:
    - Finish for today
    - Continue learning
  needs_work:
    title: <student-facing title>
    ryan_script: <EXACT completion line>
    state_write: NEEDS_WORK
    buttons:
    - Try this skill again
    - Finish for today
question_bank:
- id: <SKILL-D01>
  stage: diagnostic
  target: <single target>
  ao: <AO1|AO2|AO3>
  difficulty: 1
  prompt: <EXACT prompt>
  response:
    type: <integer|fraction|single_choice|yes_no|...>
    options: []
    input_label: null
    placeholder: null
    keyboard_submit: true
  answer:
    value: <canonical answer>
    acceptable_values: []
  attempt_policy:
    policy: <policy id>
    max_attempts_before_resolution: 1
    feedback_timing: <timing>
    submit_label: <button copy>
    allow_change_before_submit: true
    lock_after_final_submit: true
  scripts:
    on_correct_math: <EXACT mathematical follow-up only; no generic praise, or null>
    on_incorrect_attempt_1: <EXACT Ryan line or silent instruction>
    on_incorrect_attempt_2: <EXACT Ryan line or N/A>
    worked_explanation: <EXACT spoken/displayed worked explanation>
  mathematical_support:
    hint_1: <EXACT hint or null>
    hint_2: <EXACT hint or null>
    worked_solution: <EXACT solution>
  visual:
    primitive: <optional primitive>
    description: <exact visual state>
    action: <action>
  visual_feedback:
    correct: <exact feedback state>
    incorrect_attempt_1: <exact focus state>
    incorrect_attempt_2: <exact reveal state>
  recovery_item_ref: <optional authored recovery id>
  branching:
    on_submit: <or use correct/wrong branch fields for learning items>
    next: <next behaviour>
  success_reaction:
    mode: <engine_auto or silent>
    context_override: null
    selection_rule: <exact selection rule or silent rule>
progress_and_persistence:
  states:
  - UNSEEN
  - NEEDS_WORK
  - LEARNING
  - SECURE
  on_lesson_start: <state write rule>
  commit_points: []
  resume_payload: []
  history_policy: <history rule>
analytics_events:
  minimum_events: []
  privacy_note: <data minimisation note>
qa:
  schema_validated: false
  maths_answers_verified: false
  curriculum_human_reviewed: false
  scripts_human_reviewed: false
  animation_storyboard_human_reviewed: false
  branching_reference_validated: false
  engine_render_tested: false
  reduced_motion_tested: false
  keyboard_accessibility_tested: false
  student_calibration_tested: false
  acceptance_criteria:
  - <testable acceptance criterion>
