concept_model:
  core_idea: The numerator and denominator have different jobs.
  invariant: The denominator describes the partition of each whole; the numerator counts how many of those equal parts are
    taken.
  mathematical_rule: Top number = numerator; bottom number = denominator.
  vocabulary:
  - numerator
  - denominator
  - fraction bar
  - equal parts
  must_notice:
  - The numerator and denominator have different jobs.
  - The denominator describes the partition of each whole; the numerator counts how many of those equal parts are taken.
  - Top number = numerator; bottom number = denominator.
  common_confusions:
  - Swaps numerator and denominator.
  - Uses the number of unselected parts as the numerator.
  - Treats the denominator as the number selected.
