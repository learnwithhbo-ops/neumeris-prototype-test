voice_and_script:
  performer_name: Ryan
  dialogue_profile_ref: RYAN_DIALOGUE_PROFILE_v1.yaml
  script_ownership: All mathematical narration, prompts, hints, worked explanations and completion scripts in this file are
    exact authored content. The engine may select only generic reactions from the referenced Ryan profile and may not generate
    or paraphrase dialogue.
  delivery_style:
  - Natural UK English
  - Warm, conversational and encouraging
  - Praise should respond to understanding, independence or recovery rather than merely announce correctness
  - No one-word success reactions
  - No repeated praise lead-ins anywhere in the same lesson attempt
  - Do not begin a new slide by repeating praise or a conclusion that was just spoken
  - Use pauses to let the learner inspect visuals
  success_reaction_policy:
    mode: engine_select_from_authored_profile
    generation_allowed: false
    selection_state_scope: lesson_attempt
    persist_selection_history_on_refresh_resume: true
    derive_context_from:
    - stage
    - attempt_count
    - recovery_status
    - practice_streak
    no_repeat:
    - reaction_id
    - exact_text
    - lead_family
    fallback_when_pool_exhausted: Speak only the item-specific mathematical follow-up. Never repeat or invent praise.
    diagnostic: silent
    exit_and_confirmation: silent_until_completion_result
    selection: Engine selects an unused approved Ryan reaction appropriate to context without replacement; no exact text or
      lead family repeats within a lesson attempt.
    exhaustion: If the eligible bank is exhausted, speak only the question-specific mathematical follow-up. Never repeat or
      generate praise.
  adjacent_speech_policy:
    after_success: Do not play a second generic acknowledgement before the next scene.
    next_scene: Begin directly with new mathematical content.
    semantic_echo: The next scene must not restate the same mathematical conclusion just delivered in success feedback.
    item_math_feedback: May follow the selected generic reaction only when it adds mathematical value.
  caption_policy: Every spoken line must be captioned verbatim. Captions stay visible long enough to be read and disappear
    before the next unrelated line.
visual_language:
  scene_rules:
    composition: Single central teaching canvas. The mathematical object is always the largest visual element; controls remain
      below or beside it without covering the model.
    labels: Labels sit beside the exact object they describe. Symbolic notation remains close enough to the visual model to
      make the connection obvious.
    motion: Motion must reveal mathematical structure only. No decorative bouncing, confetti or unrelated character animation.
    focus: At each narration beat, de-emphasise non-essential objects and emphasise only the mathematical relationship being
      discussed.
  semantic_roles:
  - whole
  - selected_quantity
  - partition_or_unit
  - current_operation
  - unchanged_invariant
  - student_focus
  - error
  - success
  style_direction:
  - Professional educational vector style
  - Clean geometry and legible fraction typography
  - Use multiple semantic colours consistently rather than a single monochrome palette
  - Maintain high contrast and uncluttered spacing
  - Animation timing should feel deliberate rather than game-like
  primary_visual_contract:
    primitive: fraction_relation
    purpose: The numerator and denominator have different jobs.
    rules:
    - The same mathematical role keeps the same semantic colour within the lesson.
    - A transformation must preserve every quantity declared invariant by the concept model.
    - Do not animate an operation before Ryan has established what the motion means.
  animation_blueprint:
    setup: Show one written fraction beside one matching equal-part model. Numerator and denominator have separate persistent
      semantic roles, not merely different decoration.
    transform: Animate a connector from selected-part count to the numerator, then from total equal-part count in one whole
      to the denominator.
    contrast: Swap only one number in a deliberately wrong label and show the connector no longer matches the model.
    error: 'Highlight only the position/job being confused: top for selected parts, bottom for equal parts in the whole.'
    summary: 'Finish with two fixed labels: numerator = how many selected parts; denominator = how many equal parts make one
      whole.'
  reduced_motion: Replace long translations or subdivision movement with two-state morphs/crossfades while preserving all
    mathematical labels, intermediate states and narration meaning.
