concept_model:
  core_idea: Fractions can only be added directly once their parts have the same size.
  invariant: Renaming to equivalent fractions preserves each amount; addition then combines equal-sized parts.
  mathematical_rule: Choose a common denominator, rewrite both fractions equivalently, add numerators and keep the common
    denominator.
  vocabulary:
  - common denominator
  - equivalent fraction
  - multiple
  - add
  must_notice:
  - Fractions can only be added directly once their parts have the same size.
  - Renaming to equivalent fractions preserves each amount; addition then combines equal-sized parts.
  - Choose a common denominator, rewrite both fractions equivalently, add numerators and keep the common denominator.
  common_confusions:
  - Adds numerators and denominators directly.
  - Uses a denominator that is not common to both fractions.
  - Scales numerator and denominator inconsistently.
