  purpose: Determine whether this atomic skill needs teaching. Each diagnostic item targets this skill directly; do not infer
    a misconception label from a distractor in V1.
  question_refs:
  - FRA-22-D01
  - FRA-22-D02
  presentation: Two separate short items. No hints, worked solutions, correctness reveal or Ryan praise during diagnosis.
  scoring:
    2_of_2: DIAGNOSTIC_SECURE
    0_or_1_of_2: NEEDS_WORK
  routing: After all diagnostic skills are scored, start at the earliest non-secure skill in prerequisite order.
concept_model:
  core_idea: Unlike fractions must be expressed in equal-sized parts before one amount can be removed from the other.
  invariant: Equivalent conversion preserves both original values; only the final subtraction changes the amount.
  mathematical_rule: Choose a common denominator, rewrite both fractions, subtract numerators in order and keep the common
    denominator.
  vocabulary:
  - common denominator
  - equivalent fraction
  - difference
  - subtract
  must_notice:
  - Unlike fractions must be expressed in equal-sized parts before one amount can be removed from the other.
  - Equivalent conversion preserves both original values; only the final subtraction changes the amount.
  - Choose a common denominator, rewrite both fractions, subtract numerators in order and keep the common denominator.
  common_confusions:
  - Subtracts unlike numerators directly.
  - Uses an invalid common denominator.
  - Reverses the order of subtraction.
