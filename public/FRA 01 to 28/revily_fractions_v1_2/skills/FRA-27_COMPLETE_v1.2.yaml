concept_model:
  core_idea: Dividing a fraction by an integer shares that fractional amount equally into the stated number of groups.
  invariant: The total amount is conserved while each group becomes smaller.
  mathematical_rule: 'Multiply by the reciprocal of the integer: a/b ÷ n = a/b × 1/n.'
  vocabulary:
  - divide
  - share
  - reciprocal
  - equal groups
  - quotient
  must_notice:
  - Dividing a fraction by an integer shares that fractional amount equally into the stated number of groups.
  - The total amount is conserved while each group becomes smaller.
  - 'Multiply by the reciprocal of the integer: a/b ÷ n = a/b × 1/n.'
  common_confusions:
  - Divides the denominator by the integer.
  - Multiplies by the integer rather than its reciprocal.
  - Flips the dividend.
