  routing: After all diagnostic skills are scored, start at the earliest non-secure skill in prerequisite order.
concept_model:
  core_idea: Common factors in a fraction product can be divided out before multiplication because the overall value is unchanged.
  invariant: Any cancellation must divide one numerator factor and one denominator factor by the same non-zero factor.
  mathematical_rule: Find common factors across numerator and denominator factors, divide them out, then multiply what remains.
  vocabulary:
  - cancel
  - common factor
  - cross-cancel
  - product
  - simplify
  must_notice:
  - Common factors in a fraction product can be divided out before multiplication because the overall value is unchanged.
  - Any cancellation must divide one numerator factor and one denominator factor by the same non-zero factor.
  - Find common factors across numerator and denominator factors, divide them out, then multiply what remains.
  common_confusions:
  - Cancels terms across addition/subtraction.
  - Cancels denominator with denominator.
  - Divides only one side of a common factor pair.
