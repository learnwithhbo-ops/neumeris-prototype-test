concept_model:
  core_idea: If one denominator already fits the other exactly, only one fraction needs to be renamed.
  invariant: Only equivalent renaming happens before addition; once denominators match, the part size is common.
  mathematical_rule: Scale the fraction with the smaller compatible denominator to the larger denominator, then add numerators.
  vocabulary:
  - multiple
  - equivalent fraction
  - common denominator
  - add
  must_notice:
  - If one denominator already fits the other exactly, only one fraction needs to be renamed.
  - Only equivalent renaming happens before addition; once denominators match, the part size is common.
  - Scale the fraction with the smaller compatible denominator to the larger denominator, then add numerators.
  common_confusions:
  - Changes both fractions when only one needs conversion.
  - Scales the denominator without scaling the numerator.
  - Adds denominators after conversion.
