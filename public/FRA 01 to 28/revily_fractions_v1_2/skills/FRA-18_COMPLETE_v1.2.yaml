    primitive: fraction_bar_add
    purpose: If one denominator already fits the other exactly, only one fraction needs to be renamed.
    rules:
    - The same mathematical role keeps the same semantic colour within the lesson.
    - A transformation must preserve every quantity declared invariant by the concept model.
    - Do not animate an operation before Ryan has established what the motion means.
  animation_blueprint:
    setup: Show two bars of equal whole width where the larger denominator grid is already visible on one bar and the other
      has a coarser compatible grid.
    transform: Subdivide only the coarser bar by the exact integer factor until its grid matches the other; preserve its shaded
      extent, then combine shaded equal-sized parts.
    contrast: Ghost any attempt to change the already-compatible fraction; show why one conversion is enough.
    error: Highlight the denominator-multiple relationship first, then link one scale factor to numerator and denominator
      of only the fraction being renamed.
    summary: Finish with one equivalent conversion followed by FRA-17 same-denominator addition.
  reduced_motion: Replace long translations or subdivision movement with two-state morphs/crossfades while preserving all
    mathematical labels, intermediate states and narration meaning.
