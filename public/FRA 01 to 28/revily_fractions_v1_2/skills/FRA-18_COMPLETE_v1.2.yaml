progress_and_persistence:
  states:
  - UNSEEN
  - NEEDS_WORK
  - LEARNING
  - SECURE
  on_lesson_start: Write LEARNING unless already SECURE and learner explicitly chose to review.
  commit_points:
  - after each submitted answer
  - after each completed teaching checkpoint
  - on phase transition
  - on exit completion
  - on completion screen
  resume_payload:
  - skill_id
  - lesson_attempt_id
  - current_step_id
  - submitted_answers
  - attempt_counts
  - seen_recovery_items
  - exit_state
  history_policy: Starting again creates a new lesson attempt and does not delete previous attempts.
analytics_events:
  minimum_events:
  - skill_started
  - step_viewed
  - answer_submitted
  - hint_shown
  - worked_solution_shown
  - recovery_item_started
  - phase_completed
  - exit_completed
  - skill_completed
  privacy_note: Store only data required for learning/progress analytics; this file does not define personal profile fields.
qa:
  schema_validated: true
  maths_answers_verified: true
  curriculum_human_reviewed: false
  scripts_human_reviewed: false
  animation_storyboard_human_reviewed: false
  branching_reference_validated: true
  engine_render_tested: false
  reduced_motion_tested: false
  keyboard_accessibility_tested: false
  student_calibration_tested: false
  acceptance_criteria:
  - Every learner-facing mathematical line is present in this YAML; Codex adds none.
  - Every question has a canonical answer and exact response type.
  - Every interactive non-diagnostic/non-exit item defines correct, first-wrong, second-wrong and worked-resolution behaviour.
  - Every teaching checkpoint recovery reference points to an existing authored recovery item.
  - No diagnostic distractor maps to a misconception label in V1.
  - No exit hint or correctness reveal appears before the mastery decision.
  - The primary visual preserves the concept-model invariant during every transformation.
  - Refresh resumes without losing submitted progress or used Ryan reaction history.
  - No skill-specific route or lesson engine is introduced; this skill renders through the shared engine.
