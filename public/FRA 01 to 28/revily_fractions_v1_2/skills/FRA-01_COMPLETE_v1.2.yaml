concept_model:
  core_idea: A fraction describes equal parts of a defined whole.
  invariant: The whole must be fixed and its parts must be equal before a part-whole fraction is meaningful.
  mathematical_rule: Denominator = number of equal parts in the whole; numerator = number of those parts selected.
  vocabulary:
  - whole
  - equal parts
  - fraction
  - selected part
  must_notice:
  - A fraction describes equal parts of a defined whole.
  - The whole must be fixed and its parts must be equal before a part-whole fraction is meaningful.
  - Denominator = number of equal parts in the whole; numerator = number of those parts selected.
  common_confusions:
  - Counts unequal pieces as valid fraction parts.
  - Counts unselected parts instead of selected parts.
  - Changes the definition of the whole mid-question.
lesson:
  teaching_steps:
  - id: T01
    stage: teaching
    purpose: Establish the core idea before any procedure is introduced.
    estimated_seconds: 35
    scene:
      display_title: How would you share this fairly?
      variant: fair_turns_hook
      model:
        context_label: One shared gaming session
        whole_label: 60 minutes
        detail_label: four friends
        parts: 4
        turn_labels:
        - Turn 1
        - Turn 2
        - Turn 3
        - Turn 4
      layout: Single central teaching canvas with progressive captions inside the canvas.
      objects:
      - 'fraction_area: A 60-minute gaming session first appears as one whole. Four unequal turns then become four equal turns,
        and one equal turn is selected as one quarter of the hour.'
      initial_state: One unpartitioned 60-minute session bar, ready to reveal an unfair split.
    narration:
      script: Four friends are sharing one hour on a games console. At first, one turn is much longer than the others. That
        is not a fair quarter. When the four turns become equal, each person gets one of four equal parts of the hour.
      delivery: Curious and conversational; let the unfair split register before correcting it.
      sync_cues:
      - cue: one hour
        action: show_whole
      - cue: one turn is much longer
        action: reveal_unequal
      - cue: four turns become equal
        action: equalise_turns
      - cue: one of four equal parts
        action: select_one_turn
    animation_timeline:
    - id: T01-A01
      trigger: narration cue
      action: narration_choreography
      target: 60-minute session bar, four turn boundaries and one selected equal turn
      from: One unpartitioned 60-minute session.
      to: Four equal turns with one selected as one quarter.
      duration_ms: 900
      easing: ease-in-out
      semantic_purpose: Establish the core idea before any procedure is introduced.
    learner_interaction:
      question_ref: null
      input_position: directly beneath the mathematical model
      auto_focus: false
    branching:
      continue:
        ryan_script: null
        visual_action: Keep the final mathematical state visible until Continue is selected.
        next_step: T02
    next_step: T02
  - id: T02
    stage: teaching
    purpose: Make the invariant visible through the primary mathematical model.
    estimated_seconds: 35
    scene:
