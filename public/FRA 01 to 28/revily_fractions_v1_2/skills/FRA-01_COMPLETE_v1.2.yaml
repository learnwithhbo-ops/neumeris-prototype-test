      initial_state: Show the whole outline before revealing the equal parts, selection and fraction name.
    narration:
      script: The full hour is the whole. Split it into four equal turns. Now select one turn. That is one out of four equal
        parts, which we write as 1/4 and call one quarter.
      delivery: Short teaching beats, with a clear pause before naming one quarter.
      sync_cues:
