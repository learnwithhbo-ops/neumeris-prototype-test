  routing: After all diagnostic skills are scored, start at the earliest non-secure skill in prerequisite order.
concept_model:
  core_idea: Multiplying a fraction by an integer means taking that fractional amount repeatedly.
  invariant: The denominator stays the same when equal fractional parts are repeated; the number of parts is scaled.
  mathematical_rule: Multiply the numerator by the integer; keep the denominator, then simplify only if requested.
  vocabulary:
  - multiply
  - groups
  - numerator
  - integer
  - repeated addition
  must_notice:
  - Multiplying a fraction by an integer means taking that fractional amount repeatedly.
  - The denominator stays the same when equal fractional parts are repeated; the number of parts is scaled.
  - Multiply the numerator by the integer; keep the denominator, then simplify only if requested.
  common_confusions:
  - Multiplies the denominator by the integer as well.
  - Adds the integer to the numerator.
  - Treats multiplication as adding one extra copy only.
