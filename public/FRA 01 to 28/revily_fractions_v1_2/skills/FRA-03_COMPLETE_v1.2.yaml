    0_or_1_of_2: NEEDS_WORK
  routing: After all diagnostic skills are scored, start at the earliest non-secure skill in prerequisite order.
concept_model:
  core_idea: The same fraction can be represented in different ways when the same part-whole relationship is preserved.
  invariant: Changing the model does not change the fraction when the whole and selected proportion stay equivalent.
  mathematical_rule: Identify the whole first, then count equal parts or equal intervals and the selected amount.
  vocabulary:
  - area model
  - set model
  - number line
  - whole
  - equal groups
  must_notice:
  - The same fraction can be represented in different ways when the same part-whole relationship is preserved.
  - Changing the model does not change the fraction when the whole and selected proportion stay equivalent.
  - Identify the whole first, then count equal parts or equal intervals and the selected amount.
  common_confusions:
  - Counts tick marks instead of intervals.
  - Treats unequal areas as equal parts.
  - Changes the whole between representations.
