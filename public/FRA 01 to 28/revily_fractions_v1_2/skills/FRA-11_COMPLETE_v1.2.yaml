concept_model:
  core_idea: An improper fraction can be regrouped into whole groups plus a remaining fraction.
  invariant: Grouping denominator-sized sets creates wholes without changing the total amount.
  mathematical_rule: 'Divide numerator by denominator: quotient = whole part; remainder becomes the new numerator over the
    original denominator.'
  vocabulary:
  - improper fraction
  - mixed number
  - quotient
  - remainder
  - whole
  must_notice:
  - An improper fraction can be regrouped into whole groups plus a remaining fraction.
  - Grouping denominator-sized sets creates wholes without changing the total amount.
  - 'Divide numerator by denominator: quotient = whole part; remainder becomes the new numerator over the original denominator.'
  common_confusions:
  - Uses the quotient as the new numerator.
  - Ignores the remainder.
  - Places the remainder over the quotient instead of the original denominator.
