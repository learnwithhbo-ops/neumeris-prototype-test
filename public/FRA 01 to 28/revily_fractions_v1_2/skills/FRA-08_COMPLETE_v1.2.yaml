  prompt: Which fraction is equivalent to 2/3?
  response:
    type: single_choice
    options:
    - 4/6
    - 4/5
    - 3/6
    - 6/8
    input_label: null
    placeholder: null
    keyboard_submit: true
    shuffle_options: false
  answer:
    value: 4/6
  attempt_policy:
    policy: single_submit_silent
    max_attempts_before_resolution: 1
    feedback_timing: none_during_diagnostic
    submit_label: Next
    allow_change_before_submit: true
    lock_after_final_submit: true
  scripts:
    on_correct_math: null
    on_incorrect_attempt_1: Record the response silently and move on.
    on_incorrect_attempt_2: Not applicable in diagnostic.
    worked_explanation: No worked solution is shown during the diagnostic.
  mathematical_support:
    hint_1: null
    hint_2: null
    worked_solution: No worked solution is shown during the diagnostic.
  branching:
