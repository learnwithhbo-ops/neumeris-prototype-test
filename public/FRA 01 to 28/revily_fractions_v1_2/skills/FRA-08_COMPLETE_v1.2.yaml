  - Disable Continue until the current required interaction is resolved.
  - Do not use success confetti.
  - Do not shake the entire screen on an error.
  - Keep keyboard focus predictable after retry.
voice_and_script:
  performer_name: Ryan
  dialogue_profile_ref: RYAN_DIALOGUE_PROFILE_v1.yaml
  script_ownership: All lesson-specific mathematical speech is authored exactly in this skill file. Generic encouragement
    is authored exactly in the referenced Ryan dialogue profile. The engine chooses eligible generic reactions; neither Codex
    nor TTS may invent, paraphrase or extend any spoken line.
  delivery_style:
  - Natural UK English
  - Warm, conversational and encouraging
  - Praise should respond to understanding, independence or recovery rather than merely announce correctness
  - No one-word success reactions
  - No repeated praise lead-ins anywhere in the same lesson attempt
  - Do not begin a new slide by repeating praise or a conclusion that was just spoken
  - Use pauses to let the learner inspect visuals
  success_reaction_policy:
    mode: engine_select_from_authored_profile
    generation_allowed: false
    selection_state_scope: lesson_attempt
    persist_selection_history_on_refresh_resume: true
    derive_context_from:
    - stage
    - attempt_count
    - recovery_status
    - practice_streak
    no_repeat:
    - reaction_id
    - exact_text
    - lead_family
    fallback_when_pool_exhausted: Speak only the item-specific mathematical follow-up. Never repeat or invent praise.
    diagnostic: silent
    exit_and_confirmation: silent_until_completion_result
  adjacent_speech_policy:
    after_success: Do not play a second generic acknowledgement before the next scene.
    next_scene: Begin directly with new mathematical content.
    semantic_echo: The next scene must not restate the same mathematical conclusion just delivered in success feedback.
    item_math_feedback: May follow the selected generic reaction only when it adds mathematical value.
  caption_policy: Every spoken line must be captioned verbatim. Captions stay visible long enough to be read and disappear
    before the next unrelated line.
visual_language:
  scene_rules:
    composition: Single central teaching canvas. Keep the primary fraction bar centred. Never show more than two comparison
      bars simultaneously.
    labels: Place fraction labels directly beneath their bars. Keep symbolic equality close to the visuals it describes.
    motion: Use movement only to expose mathematical structure. No decorative bouncing, confetti or unrelated character motion.
    focus: At each narration beat, de-emphasise non-essential objects and emphasise only the mathematical object being discussed.
  semantic_roles:
  - whole
  - shaded_quantity
  - original_partition
  - new_partition
  - active_multiplier
  - student_focus
  - error
  - success
  style_direction:
  - Professional educational vector style
  - Clean geometry
  - High contrast between mathematical roles
  - Multiple relevant semantic colours rather than one monochrome palette
  - No decorative illustrations that compete with the maths
  fraction_bar_contract:
    whole_size: All comparison bars representing the same whole must have identical total width.
    partition_lines: Partition lines appear only where mathematically meaningful and stay aligned during subdivision.
    shading: Shaded quantity must preserve its physical extent during an equivalence transformation.
    labels: Fraction label beneath bar; numerator and denominator vertically stacked when shown as a fraction.
  reduced_motion: If reduced-motion is enabled, replace physical subdivision with a two-state morph/crossfade while preserving
    intermediate mathematical labels and narration meaning.
  animation_blueprint:
    setup: 'Use the existing FRA-08 fraction-bar contract: identical whole width, original partitions visible, target subdivisions
      introduced only when narration calls for them.'
    transform: Subdivide or regroup every original partition by the exact stated scale factor while preserving shaded physical
      extent; draw linked multiplier markers on numerator and denominator.
    contrast: Animate a one-sided scale change as an invalid ghost state, then restore and apply the same factor to both fields.
    error: Highlight the known scale factor first, then the missing numerator/denominator field; never move shaded endpoint
      during a valid equivalence change.
    summary: Finish with numerator ×/÷ k and denominator ×/÷ k linked by one bracket, value unchanged.
diagnostic:
  purpose: Locate whether this skill should be taught; do not infer misconception type from a distractor.
  question_refs:
  - FRA-08-D01
  - FRA-08-D02
  presentation: Two separate short items. No hints, worked solutions, correctness reveal or Ryan praise during diagnostic.
  scoring:
    2_of_2: DIAGNOSTIC_SECURE
    0_or_1_of_2: NEEDS_WORK
  routing: After all diagnostic skills are scored, start at the earliest non-secure skill in prerequisite order.
concept_model:
  core_idea: You can rename a fraction without changing its value by scaling both parts together.
  invariant: The value remains unchanged only when numerator and denominator are multiplied or divided by the same non-zero
    factor.
  mathematical_rule: Apply the same scale factor to numerator and denominator.
  vocabulary:
  - equivalent
  - numerator
  - denominator
  - scale factor
  - same value
  must_notice:
  - The whole stays the same size.
  - The shaded amount stays the same even when the number of pieces changes.
  - If each original piece is split into the same number of smaller pieces, both numerator and denominator are multiplied
    by that number.
  - Changing only the numerator or only the denominator changes the value and does not preserve equivalence.
  common_confusions:
  - Changes denominator only.
  - Uses inconsistent scale factors.
  - Uses addition instead of multiplication/division scaling.
lesson:
  teaching_steps:
  - id: T01
    stage: teaching
    purpose: Hook with the invariant before introducing a rule.
    estimated_seconds: 35
    scene:
      layout: single_bar_focus
      objects:
      - 'bar_A: one whole split into 2'
      - 'label_A: 1/2'
      initial_state: bar_A has two equal cells; left cell uses shaded_quantity role; label 1/2 visible.
    narration:
      script: Look at this half. I'm going to cut every piece into smaller pieces - but I'm not changing how much is shaded.
      delivery: Warm, curious, unhurried. Short pause after "smaller pieces".
      sync_cues:
      - cue: on_line_start
        action: show bar_A
      - cue: 'on_words: not changing how much is shaded'
        action: soft emphasis on shaded region
    animation_timeline:
    - id: A01
      trigger: on_scene_enter
      action: fade_in
      target: bar_A
      duration_ms: 350
      easing: ease-out
      semantic_purpose: Establish one whole and one-half.
    next_step: T02
  - id: T02
    stage: teaching
    purpose: Make equivalence visible through subdivision.
    estimated_seconds: 30
    scene:
      layout: single_bar_focus
      objects:
      - bar_A
      initial_state: Carry forward T01.
    narration:
      script: Each half is splitting into two equal pieces. Same bar. Same shaded amount. Just more, smaller pieces.
      delivery: Synchronise "splitting" with motion; stress "Same" lightly.
      sync_cues:
      - cue: 'on_word: splitting'
        action: start A02
      - cue: 'on_phrase: Same shaded amount'
        action: brief glow on unchanged shaded extent
    animation_timeline:
    - id: A02
      trigger: narration_sync
      action: subdivide_each_partition
      target: bar_A
      from: 2 equal parts
      to: 4 equal parts
      factor: 2
      preserve_shaded_extent: true
      duration_ms: 1100
      easing: ease-in-out
      semantic_purpose: Show that subdivision changes the number of parts, not the represented amount.
    - id: A03
      trigger: after:A02
      action: crossfade_label
      target: label_A
      from: 1/2
      to: 2/4
      duration_ms: 300
      easing: ease-out
      semantic_purpose: Connect the visual state to the equivalent symbolic fraction.
    next_step: T03
  - id: T03
    stage: teaching_checkpoint
    purpose: Learner reads the new numerator from the visual.
    estimated_seconds: 55
    scene:
      layout: single_bar_with_prompt
      objects:
      - bar_A labelled 2/4
      - question input
      initial_state: Keep the subdivided bar visible. Pulse the two shaded cells once, then stop.
    narration:
      script: How many of the four smaller pieces are shaded now?
      delivery: Ask naturally, then remain silent while learner works.
      sync_cues: []
    animation_timeline: []
    learner_interaction:
      question_ref: FRA-08-C01
      input_position: below_visual
      auto_focus: true
    branching:
      correct:
        visual_action: Highlight the two shaded cells once; display 1/2 = 2/4.
        next_step: T04
        spoken_feedback_source: question_bank item success reaction + scripts.on_correct_math
      incorrect_attempt_1:
        visual_action: Highlight only shaded cells; allow retry.
        next_step: T03
        spoken_feedback_source: question_bank item scripts.on_incorrect_attempt_1
      incorrect_attempt_2:
        visual_action: Replay subdivision on shaded half at half speed, then show worked explanation.
        next_step: FRA-08-R01
        spoken_feedback_source: question_bank item scripts.on_incorrect_attempt_2
      recovery_correct:
        next_step: T04
      recovery_resolved_after_two_attempts:
        next_step: T04
  - id: T04
    stage: teaching
    purpose: Connect the visual to symbolic equality.
    estimated_seconds: 30
    scene:
      layout: two_bar_compare
      objects:
      - 'bar_left: 1/2'
      - 'bar_right: 2/4'
      - equality label
      initial_state: Bars aligned to identical total width; shaded endpoints line up.
    narration:
      script: 'Here is the name for what you have just seen: one half and two quarters are equivalent fractions. Different
        numbers, same amount.'
      delivery: Introduce the term "equivalent fractions" clearly. Do not add another success acknowledgement at scene start.
      sync_cues:
      - cue: 'on_phrase: same amount'
        action: draw thin alignment guide between shaded endpoints, then fade it
    animation_timeline:
    - id: A04
      trigger: on_scene_enter
      action: slide_compare_bars_into_alignment
      target: bar_left,bar_right
      duration_ms: 500
      easing: ease-out
      semantic_purpose: Make equal represented quantities visually comparable.
    - id: A05
      trigger: after:A04
      action: reveal_equation
      target: 1/2 = 2/4
      duration_ms: 250
      easing: ease-out
      semantic_purpose: Connect representation to notation.
    next_step: T05
  - id: T05
    stage: teaching
    purpose: Generalise to a scale factor of three.
    estimated_seconds: 45
    scene:
      layout: single_bar_focus
      objects:
      - 'bar_B: 3/5'
      - label_B
      initial_state: Show five equal cells with three shaded.
    narration:
      script: Now watch three fifths. If every fifth is split into three equal pieces, the denominator becomes fifteen - and
        the shaded pieces triple as well.
      delivery: Synchronise the word "split" with subdivision and "triple" with grouped shaded pieces.
      sync_cues: []
    animation_timeline:
    - id: A06
      trigger: 'on_phrase: split into three'
      action: subdivide_each_partition
      target: bar_B
      from: 5 equal parts
      to: 15 equal parts
      factor: 3
      preserve_shaded_extent: true
      duration_ms: 1250
      easing: ease-in-out
      semantic_purpose: Show common scale factor 3.
    - id: A07
      trigger: after:A06
      action: relabel
      target: label_B
      from: 3/5
      to: 9/15
      duration_ms: 300
      easing: ease-out
      semantic_purpose: Show both numerator and denominator scale together.
    next_step: T06
  - id: T06
    stage: teaching_checkpoint
    purpose: Learner links denominator scaling to numerator scaling.
    estimated_seconds: 55
    scene:
      layout: two_fraction_relation
      objects:
      - 3/5
      - 9/15
      - x3 marker under denominators
      - multiple-choice response
      initial_state: Show x3 only from 5 to 15. Do not show numerator relation before response.
    narration:
      script: The denominator was multiplied by three. What has to happen to the numerator?
      delivery: Emphasise "same" only in feedback, not in the question.
      sync_cues: []
    animation_timeline: []
    learner_interaction:
      question_ref: FRA-08-C02
      input_position: below_equation
      auto_focus: false
    branching:
      correct:
        visual_action: Reveal matching x3 marker from 3 to 9.
        next_step: T07
        spoken_feedback_source: question_bank item success reaction + scripts.on_correct_math
      incorrect_attempt_1:
        visual_action: Pulse 3 and 9 only.
        next_step: T06
        spoken_feedback_source: question_bank item scripts.on_incorrect_attempt_1
      incorrect_attempt_2:
        visual_action: Animate 3 x 3 -> 9 and 5 x 3 -> 15 side by side.
        next_step: FRA-08-R02
        spoken_feedback_source: question_bank item scripts.on_incorrect_attempt_2
      recovery_correct:
        next_step: T07
      recovery_resolved_after_two_attempts:
        next_step: T07
  - id: T07
    stage: teaching
    purpose: State the general rule only after the visual reasoning.
    estimated_seconds: 35
    scene:
      layout: rule_summary
      objects:
      - a/b
      - (a x k)/(b x k)
      - paired multiplier markers
      initial_state: Fraction bars shrink to a small reference at the top; symbolic rule becomes main focus.
    narration:
      script: That's the rule. Whatever multiplier you use on the bottom, use the same multiplier on the top. The numbers
        change; the value doesn't.
      delivery: Confident and concise. Small pause before final sentence.
      sync_cues: []
    animation_timeline:
    - id: A08
      trigger: 'on_phrase: same multiplier'
      action: draw_linked_multiplier_markers
      target: numerator and denominator
      duration_ms: 450
      easing: ease-out
      semantic_purpose: Encode the same scale factor acting on both parts.
    next_step: T08
  - id: T08
    stage: teaching_checkpoint
    purpose: Contrast a valid and invalid change.
    estimated_seconds: 55
    scene:
      layout: contrast_card
      objects:
      - 2/5 bar
      - 4/7 bar
      - Yes/No controls
      initial_state: Bars have same whole width. Do not reveal endpoint mismatch emphasis until submission.
    narration:
      script: One quick check. Two fifths becomes four sevenths. Equivalent or not?
      delivery: Neutral; do not cue the answer.
      sync_cues: []
    animation_timeline: []
    learner_interaction:
      question_ref: FRA-08-C03
      input_position: below_visual
      auto_focus: false
    branching:
      correct:
        visual_action: Show 2/5 -> 4/10 as the correct doubling and ghost out 4/7.
        next_step: T09
        spoken_feedback_source: question_bank item success reaction + scripts.on_correct_math
      incorrect_attempt_1:
        visual_action: Reveal x2 above 2 -> 4 and leave denominator blank for learner to reconsider.
        next_step: T08
        spoken_feedback_source: question_bank item scripts.on_incorrect_attempt_1
      incorrect_attempt_2:
        visual_action: Animate 5 x 2 -> 10 and place 4/10 beside 4/7.
        next_step: FRA-08-R03
        spoken_feedback_source: question_bank item scripts.on_incorrect_attempt_2
      recovery_correct:
        next_step: T09
      recovery_resolved_after_two_attempts:
        next_step: T09
  - id: T09
    stage: teaching
    purpose: Resolve the contrast and reinforce the invariant.
    estimated_seconds: 30
    scene:
      layout: contrast_resolution
      objects:
      - 2/5
      - 4/10
      - 4/7 crossed softly
      initial_state: Carry forward correct doubling from T08.
    narration:
      script: 'Now compare the valid pair: two fifths and four tenths. The pieces are smaller, but the shaded amount still
        ends at the same point.'
      delivery: Use the aligned bars to reinforce the invariant visually. Do not repeat "not equivalent" from the previous
        feedback.
      sync_cues: []
    animation_timeline:
    - id: A09
      trigger: 'on_phrase: same scale factor'
      action: highlight_matching_x2
      target: 2->4 and 5->10
      duration_ms: 500
      easing: ease-out
      semantic_purpose: Reinforce common scaling.
    next_step: T10
  - id: T10
    stage: teaching
    purpose: Transition into transfer with fading support.
    estimated_seconds: 25
    scene:
      layout: clean_transition
      objects:
      - 'phase label: Try it with me'
      initial_state: Clear prior visuals. Keep progress indicator.
    narration:
      script: You have seen the idea from the picture and from the numbers. I will stay with you for one question, then the
        support starts to come away.
      delivery: Warm transition into learner responsibility; no generic praise opener.
      sync_cues: []
    animation_timeline:
    - id: A10
      trigger: on_scene_enter
      action: crossfade_phase
      target: teaching -> guided
      duration_ms: 350
      easing: ease-out
      semantic_purpose: Signal a change in learner responsibility.
    next_step: G01
  transfer_steps:
    G01:
      stage: guided
      question_ref: FRA-08-G01
      support_level: high
      estimated_seconds: 90
      pre_question_script: I'll give you the scale factor this time. Five has become fifteen - that's times three. What should
        happen to the two?
      visual_before_answer: Show 2/5 as a bar. Subdivide each fifth into three and display 5 x 3 = 15 below the denominator;
        leave the numerator answer blank.
      correct_next: F01
      recovery_ref: FRA-08-R04
    F01:
      stage: faded
      question_ref: FRA-08-F01
      support_level: reduced
      estimated_seconds: 100
      pre_question_script: This time I won't give you the multiplier. Find it from the numbers you can already see.
      visual_before_answer: No bar and no multiplier marker on first attempt. Show only 4/7 = 12/? in a clean fraction layout.
      correct_next: I01
      recovery_ref: FRA-08-R05
    I01:
      stage: independent_transfer
      question_ref: FRA-08-I01
      support_level: none
      estimated_seconds: 110
      pre_question_script: Now take this one on your own. No picture first - just use the idea you've learned.
      visual_before_answer: Show only 5/6 = ?/24 with no hints, multiplier marks or fraction bar.
      correct_next: P01
      recovery_ref: FRA-08-R06
  practice:
    intro_script: Five questions now. The first couple are straightforward; then the format gets a little less familiar.
    question_order:
    - FRA-08-P01
    - FRA-08-P02
    - FRA-08-P03
    - FRA-08-P04
    - FRA-08-P05
    question_count: 5
    feedback_policy: Immediate authored feedback. Up to two attempts. After the second miss, show the worked explanation and
      continue; practice does not by itself decide mastery.
    between_question_transition: Do not add a generic transition immediately after a success reaction. Move directly to the
      next question unless the Ryan dialogue engine selects an unused transition because the interface genuinely needs a spoken
      bridge.
  exit:
    intro_script: Last check. Two questions, no hints while you're answering. This is just to see whether the idea holds when
      I step away.
    primary_question_refs:
    - FRA-08-E01
    - FRA-08-E02
    confirmation_question_refs:
    - FRA-08-E03
    - FRA-08-E04
    submission_policy: One submission per exit item. Do not reveal correctness until both primary exit items are completed.
    mastery_logic:
      2_correct_of_2: SECURE
      1_correct_of_2: Ask one unused confirmation item. Correct -> SECURE. Incorrect -> NEEDS_WORK.
      0_correct_of_2: NEEDS_WORK
    confirmation_selection: Use E03 first unless already seen in this lesson attempt; otherwise E04.
completion:
  secure:
    title: Skill complete
    ryan_script: 'That was a really strong finish. You have learned the key idea and you were able to use it on your own:
      equivalent fractions can look different while the amount stays the same. You can call it there for today, or keep going
      while it is fresh.'
    state_write: SECURE
    buttons:
    - Finish for today
    - Continue learning
  needs_work:
    title: One more pass will help
    ryan_script: You have made good progress here. The scale-factor idea is not quite automatic yet, so I would rather give
      it one more short pass than rush you into the next skill. We will keep the next round focused and make it click.
    state_write: NEEDS_WORK
    buttons:
    - Try this skill again
    - Finish for today
