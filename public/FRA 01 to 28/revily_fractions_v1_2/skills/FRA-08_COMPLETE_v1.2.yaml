  required_skill_refs:
  - FRA-01
  - FRA-07
  - P-N01
  entry_assumptions:
  - The learner understands fractions as equal parts and can recognise equivalent fractions.
  - The learner can use basic multiplication and division facts for small whole numbers.
  downstream_rule: Do not store leads_to. Derive downstream relationships from other skills prerequisite references.
