spec_intent:
  source_of_truth: true
  codex_role: implementation_only
  codex_must_not_invent:
  - mathematics
  - question wording
  - answers
  - Ryan dialogue
  - hints
  - worked solutions
  - animation storyboards
  - branching behaviour
  - mastery rules
  - lesson sequence
  - success reactions
  - reaction sequencing
  allowed_engine_interpretation: Codex may implement responsive layout, reusable components, state handling and animation
    mechanics only where they preserve the authored behaviour in this file. The runtime engine may select among exact approved
    Ryan reaction lines according to the referenced Ryan dialogue profile; it may not generate or paraphrase dialogue.
identity:
  id: FRA-08
  slug: equivalent-fractions
  title: Equivalent Fractions
  strand: Number
  cluster: Fractions
  tier: GCSE Foundation
  status: spec_complete_pending_human_review_v1_2
  estimated_minutes:
    min: 24
    max: 30
curriculum:
  basis: England GCSE Mathematics / national curriculum spine
  role: gcse_enabling_prerequisite
  official_mapping:
    direct_gcse_refs: []
    supports_gcse_refs:
    - source: DfE GCSE Mathematics subject content
      ref: Number 1
      relationship: Equivalent-fraction fluency supports ordering fractions.
    - source: DfE GCSE Mathematics subject content
      ref: Number 2
      relationship: Equivalent fractions are an enabling idea for accurate calculation with simple fractions and mixed numbers.
    - source: DfE GCSE Mathematics subject content
      ref: Number 8
      relationship: Equivalent-fraction fluency supports exact calculation with fractions.
    prior_curriculum_refs:
    - source: National curriculum in England
      ref: Key stage 3 working mathematically
      relationship: Pupils should move freely between representations, including equivalent fractions.
    - source: National curriculum in England
      ref: Key stage 3 Number
      relationship: GCSE builds on earlier fraction fluency and operations; Key stage 4 explicitly consolidates Key stage
        3 content.
    registry_compatibility: Revily Fractions Curriculum Registry v0.9 Draft; FRA-08 stable implemented ID preserved.
  learning_objective: Generate an equivalent fraction by multiplying or dividing the numerator and denominator by the same
    non-zero whole-number factor.
  success_criteria:
  - Recognise when two simple fractions are equivalent.
  - Generate an equivalent fraction using a stated or inferred integer scale factor.
  - Find a missing numerator or denominator in a pair of equivalent fractions.
  - Explain, at a basic level, that the value stays the same because numerator and denominator are scaled by the same factor.
  boundaries:
    includes:
    - Missing numerator
    - Missing denominator
    - Multiplication scaling
    - Exact division scaling
    excludes:
    - LCM
    - Unlike-denominator operations
    - Full simplification as the main target
