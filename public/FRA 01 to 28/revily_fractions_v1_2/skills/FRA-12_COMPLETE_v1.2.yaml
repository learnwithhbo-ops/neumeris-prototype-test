concept_model:
  core_idea: A mixed number can be counted entirely in equal fractional parts.
  invariant: The denominator stays the same because the size of each part does not change.
  mathematical_rule: whole × denominator + numerator gives the new numerator; keep the denominator.
  vocabulary:
  - mixed number
  - improper fraction
  - whole
  - numerator
  - denominator
  must_notice:
  - A mixed number can be counted entirely in equal fractional parts.
  - The denominator stays the same because the size of each part does not change.
  - whole × denominator + numerator gives the new numerator; keep the denominator.
  common_confusions:
  - Adds the whole part to the numerator.
  - Changes the denominator.
  - Forgets to add the original numerator after multiplying.
