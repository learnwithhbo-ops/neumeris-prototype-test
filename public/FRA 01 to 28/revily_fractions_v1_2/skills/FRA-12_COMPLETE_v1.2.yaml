visual_language:
  scene_rules:
    composition: Single central teaching canvas. The mathematical object is always the largest visual element; controls remain
      below or beside it without covering the model.
    labels: Labels sit beside the exact object they describe. Symbolic notation remains close enough to the visual model to
      make the connection obvious.
    motion: Motion must reveal mathematical structure only. No decorative bouncing, confetti or unrelated character animation.
    focus: At each narration beat, de-emphasise non-essential objects and emphasise only the mathematical relationship being
      discussed.
  semantic_roles:
  - whole
  - selected_quantity
  - partition_or_unit
  - current_operation
  - unchanged_invariant
  - student_focus
  - error
  - success
  style_direction:
  - Professional educational vector style
  - Clean geometry and legible fraction typography
  - Use multiple semantic colours consistently rather than a single monochrome palette
  - Maintain high contrast and uncluttered spacing
  - Animation timing should feel deliberate rather than game-like
  primary_visual_contract:
    primitive: mixed_number_model
    purpose: A mixed number can be counted entirely in equal fractional parts.
    rules:
    - The same mathematical role keeps the same semantic colour within the lesson.
    - A transformation must preserve every quantity declared invariant by the concept model.
    - Do not animate an operation before Ryan has established what the motion means.
  animation_blueprint:
    setup: Show the mixed number as complete whole bars plus one final bar divided into the stated denominator, with the fractional
      numerator shaded.
    transform: Split every whole into denominator-sized parts, flatten all parts into one row, count whole-part pieces plus
      leftover numerator pieces, and retain the denominator.
    contrast: Keep denominator unchanged throughout; visibly prevent adding whole number directly to numerator.
    error: Highlight whole × denominator first, then add the original numerator as a separate second motion.
    summary: Finish with new numerator = whole×denominator + numerator; denominator unchanged.
  reduced_motion: Replace long translations or subdivision movement with two-state morphs/crossfades while preserving all
    mathematical labels, intermediate states and narration meaning.
