    0_or_1_of_2: NEEDS_WORK
  routing: After all diagnostic skills are scored, start at the earliest non-secure skill in prerequisite order.
concept_model:
  core_idea: Equivalent fractions look different but represent the same value.
  invariant: The represented amount stays unchanged when numerator and denominator are scaled consistently.
  mathematical_rule: Two fractions are equivalent when one can be obtained from the other by multiplying or dividing numerator
    and denominator by the same non-zero factor.
  vocabulary:
  - equivalent
  - same value
  - scale factor
  - same proportion
  must_notice:
  - Equivalent fractions look different but represent the same value.
  - The represented amount stays unchanged when numerator and denominator are scaled consistently.
  - Two fractions are equivalent when one can be obtained from the other by multiplying or dividing numerator and denominator
    by the same non-zero factor.
  common_confusions:
  - Adds the same number to top and bottom.
  - Judges equivalence by denominator size alone.
  - Accepts a change made to only one part of the fraction.
