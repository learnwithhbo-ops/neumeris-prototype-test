concept_model:
  core_idea: Simplifying by a stated factor is an exact equivalent-fraction division step.
  invariant: The value is preserved because numerator and denominator are divided by the same common factor.
  mathematical_rule: Divide both numerator and denominator by the stated common factor.
  vocabulary:
  - simplify
  - common factor
  - divide
  - equivalent
  must_notice:
  - Simplifying by a stated factor is an exact equivalent-fraction division step.
  - The value is preserved because numerator and denominator are divided by the same common factor.
  - Divide both numerator and denominator by the stated common factor.
  common_confusions:
  - Divides only one part of the fraction.
  - Subtracts the stated factor instead of dividing.
  - Uses a factor that is not common to numerator and denominator.
