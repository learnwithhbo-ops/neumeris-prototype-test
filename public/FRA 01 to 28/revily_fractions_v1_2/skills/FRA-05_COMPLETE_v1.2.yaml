concept_model:
  core_idea: Fractions are numbers with exact positions on a number line.
  invariant: The distance from 0 to 1 represents one whole and must be split into equal intervals.
  mathematical_rule: Denominator tells how many equal intervals make one whole; numerator tells how many intervals to move
    from zero.
  vocabulary:
  - interval
  - tick mark
  - number line
  - between
  - whole
  must_notice:
  - Fractions are numbers with exact positions on a number line.
  - The distance from 0 to 1 represents one whole and must be split into equal intervals.
  - Denominator tells how many equal intervals make one whole; numerator tells how many intervals to move from zero.
  common_confusions:
  - Counts tick marks rather than intervals.
  - Starts counting intervals from one instead of zero.
  - Treats each tick as one whole.
