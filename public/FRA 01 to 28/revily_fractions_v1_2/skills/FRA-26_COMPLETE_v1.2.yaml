  presentation: Two separate short items. No hints, worked solutions, correctness reveal or Ryan praise during diagnosis.
  scoring:
    2_of_2: DIAGNOSTIC_SECURE
    0_or_1_of_2: NEEDS_WORK
  routing: After all diagnostic skills are scored, start at the earliest non-secure skill in prerequisite order.
concept_model:
  core_idea: A reciprocal is the number that multiplies with the original number to make one.
  invariant: For a non-zero fraction a/b, swapping numerator and denominator gives b/a and their product is 1.
  mathematical_rule: Reciprocal of a/b is b/a; reciprocal of integer n is 1/n.
  vocabulary:
  - reciprocal
  - product
  - one
  - flip
  - non-zero
  must_notice:
  - A reciprocal is the number that multiplies with the original number to make one.
  - For a non-zero fraction a/b, swapping numerator and denominator gives b/a and their product is 1.
  - Reciprocal of a/b is b/a; reciprocal of integer n is 1/n.
  common_confusions:
  - Negates instead of reciprocating.
  - Leaves an integer unchanged instead of writing 1/n.
  - Attempts to take the reciprocal of zero.
