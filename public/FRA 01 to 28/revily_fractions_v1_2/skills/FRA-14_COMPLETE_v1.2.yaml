  routing: After all diagnostic skills are scored, start at the earliest non-secure skill in prerequisite order.
concept_model:
  core_idea: If you know a fractional part, you can rebuild one equal part and then the whole.
  invariant: All denominator parts are equal, so the known numerator parts can be scaled back to one part and then up to the
    full denominator.
  mathematical_rule: Divide the known amount by the numerator to find one part, then multiply by the denominator.
  vocabulary:
  - whole
  - fractional part
  - one part
  - scale up
  - reverse
  must_notice:
  - If you know a fractional part, you can rebuild one equal part and then the whole.
  - All denominator parts are equal, so the known numerator parts can be scaled back to one part and then up to the full denominator.
  - Divide the known amount by the numerator to find one part, then multiply by the denominator.
  common_confusions:
  - Treats the known part as the whole.
  - Divides by the denominator first.
  - Finds one part but does not rebuild all denominator parts.
