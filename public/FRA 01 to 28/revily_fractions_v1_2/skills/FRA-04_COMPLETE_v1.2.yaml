  - FRA-04-D02
  presentation: Two separate short items. No hints, worked solutions, correctness reveal or Ryan praise during diagnosis.
  scoring:
    2_of_2: DIAGNOSTIC_SECURE
    0_or_1_of_2: NEEDS_WORK
  routing: After all diagnostic skills are scored, start at the earliest non-secure skill in prerequisite order.
concept_model:
  core_idea: Shared structure lets you compare fractions without converting them.
  invariant: With equal-sized parts, more selected parts means a larger fraction; with the same number of selected parts,
    larger pieces make a larger fraction.
  mathematical_rule: 'Same denominator: compare numerators. Same numerator: smaller denominator means larger pieces and therefore
    the larger fraction.'
  vocabulary:
  - greater than
  - less than
  - equal to
  - same denominator
  - same numerator
  must_notice:
  - Shared structure lets you compare fractions without converting them.
  - With equal-sized parts, more selected parts means a larger fraction; with the same number of selected parts, larger pieces
    make a larger fraction.
  - 'Same denominator: compare numerators. Same numerator: smaller denominator means larger pieces and therefore the larger
    fraction.'
  common_confusions:
  - Compares denominators only.
  - Assumes the larger denominator always means the larger fraction.
  - Reverses < and >.
