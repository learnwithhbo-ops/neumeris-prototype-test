<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FRA08 390 px responsive QA</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #d7dce2; font-family: system-ui, sans-serif; }
      main { width: 390px; margin: 18px auto; }
      p { margin: 0 0 8px; color: #24344d; font-weight: 700; }
      iframe { display: block; width: 390px; height: 844px; border: 3px solid #24344d; border-radius: 10px; background: white; }
    </style>
  </head>
  <body>
    <main>
      <p>FRA08 viewport: 390 &times; 844</p>
      <iframe id="fra08-mobile" title="FRA08 mobile viewport" src="about:blank"></iframe>
    </main>
    <script>
      const frame = document.querySelector("#fra08-mobile");
      localStorage.setItem("revily.fractions.FRA-08.current.v1", JSON.stringify({
        version: 1,
        contentVersion: "fra08-equivalent-fractions-v1",
        topicId: "fractions",
        skillId: "FRA-08",
        cursor: "M1",
        started: true,
        soundOn: false
      }));
      frame.addEventListener("load", () => {
        setTimeout(() => frame.contentWindow.document.querySelector(".interaction")?.scrollIntoView({ block: "center" }), 350);
      });
      frame.src = "../?dev=1#/fractions/FRA-08";
    </script>
  </body>
</html>
