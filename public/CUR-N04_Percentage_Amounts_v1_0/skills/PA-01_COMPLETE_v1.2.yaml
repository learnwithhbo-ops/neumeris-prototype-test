qa_acceptance:
  source_alignment:
    - School, library, farm, theatre, container, college, factory, laptop and tank contexts are adapted from the approved PA-01 source.
    - The lesson stays within role identification and p/100 × A setup; no later percentage strategy is taught.
    - Diagnostic and delayed retrieval material are retained only as future source content, not placed in the active route.
  learner_facing:
    - Every scored item has distinct correct, first-incorrect and second-incorrect mathematical feedback where support is allowed.
    - Exit and confirmation items are one-shot and provide no hints before completion.
    - Visual and accessible labels do not identify the assessed role or expression before submission.
    - Worked solutions reveal the role or setup after resolution without auto-filling or auto-submitting a learner answer.
