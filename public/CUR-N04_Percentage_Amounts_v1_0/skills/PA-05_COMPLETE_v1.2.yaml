    answer: { value: Find 10% of the whole and select six equal 10% groups. }
    attempt_policy: &supported { policy: two_attempt_then_targeted_repair, max_attempts_before_resolution: 2, feedback_timing: immediate, submit_label: Check answer, allow_change_before_submit: true, lock_after_final_submit: true }
    scripts: { on_correct_reaction: You used six unchanged ten-percent groups., on_correct_math: '60% = 6 × 10% of the same whole.', on_incorrect_attempt_1: First identify the value of one ten-percent group., on_incorrect_attempt_2: Sixty percent needs six equal copies of that group., worked_explanation: 'Find A ÷ 10, then multiply that result by 6.' }
    mathematical_support: { hint_1: Remove the zero from 60% to count the groups., hint_2: The group value does not change., worked_solution: '60% of A = (A ÷ 10) × 6.' }
