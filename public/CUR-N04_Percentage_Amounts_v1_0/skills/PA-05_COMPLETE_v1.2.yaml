    attempt_policy: *supported
    scripts: { on_correct_reaction: You mapped seventy percent to seven groups., on_correct_math: Seven copies of 10% make 70%., on_incorrect_attempt_1: Count how many tens are in seventy., on_incorrect_attempt_2: Seventy percent selects seven equal ten-percent groups., worked_explanation: '70% = 7 × 10%.' }
