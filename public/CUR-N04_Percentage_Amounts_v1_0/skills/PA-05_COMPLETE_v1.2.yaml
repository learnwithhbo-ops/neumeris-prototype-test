    scripts: { on_correct_reaction: You combined five equal groups from the same whole., on_correct_math: '30% plus 20% is 50%, and 50% of 480 is 240 points.', on_incorrect_attempt_1: Find the same ten-percent group and use three plus two copies., on_incorrect_attempt_2: Ten percent is 48; five groups total 240., worked_explanation: '480 ÷ 10 = 48; 48 × 5 = 240.' }
    mathematical_support: { hint_1: Three groups plus two groups make five groups., hint_2: One group is 48 points., worked_solution: '240 points' }
