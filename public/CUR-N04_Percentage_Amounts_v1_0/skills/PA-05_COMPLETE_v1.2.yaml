schema_version: '1.2'
spec_intent:
  source_of_truth: true
  implementation_status: production_batch_1
  source_material: { title: PA 05 — Find Multiples of 10% of an Amount, path: authoring-source-redacted.pdf, authoritative_pages: 1-18 }
  authored_scope: Teach multiples of 10% by finding one 10% group and selecting the required number of equal groups from the same whole.
  excluded_from_active_route: [Diagnostic questions, Delayed retrieval questions, 5% and arbitrary percentages]

identity:
  id: PA-05
  slug: find-multiples-of-ten-percent
  title: Find Multiples of 10% of an Amount
  strand: Number
  cluster: Percentage Amounts
  tier: GCSE Foundation
  status: production_batch_1
  estimated_minutes: { min: 18, max: 24 }

curriculum:
  learning_objective: Find 20%, 30%, 40%, 60%, 70%, 80% and 90% by finding 10% first and selecting the required number of equal 10% groups.
  success_criteria: [Find one 10% group from the original whole., Match a multiple of 10% to the correct number of equal groups., Scale the unchanged 10% value by the group count., Preserve units and check that the result stays below the positive whole.]
  boundaries:
    includes: [Positive whole-number multiples of 10% from 20% to 90%, Whole-number and simple decimal results, Direct calculations and short contexts]
    excludes: [5% and other multiples of 5%, Arbitrary percentages, Money-specific conventions, Percentage change and reverse percentages]

dependencies:
  required_skill_refs: [PA-01, PA-02]
  entry_assumptions: [The learner can find 10% by dividing by 10, The learner can multiply by a one-digit group count]
  downstream_rule: PA-06 and PA-07 may combine this equal-group structure with other benchmarks; PA-05 uses only whole multiples of 10%.

engine_capability_requirements:
  input_types: [single_choice, decimal]
  visual_primitives: [percentage_strip, caption_layer, progress_indicator]
  animation_actions: [fade_in, highlight, reveal_equation, contrast, crossfade_phase]
  audio_capabilities: [browser_speech, caption_sync, pause_for_input, cancel_on_navigation]
  state_capabilities: [attempt_count, step_resume, exit_score, confirmation_branch]

experience_contract:
  authored_feedback_only: true
  ordered_phases: [teaching, guided, faded, independent_transfer, practice, exit, completion]
  navigation: { default: linear_forward, refresh_resume: Resume at the latest committed step., start_again: Reset only this lesson attempt and preserve historical completion records. }
  interaction_rules: [Never auto-submit or auto-fill an answer., Keep input available while Ryan speaks., Keep every repeated 10% group equal and tied to the original whole.]

voice_and_script:
  performer_name: Ryan
  dialogue_profile_ref: RYAN_DIALOGUE_PROFILE_v1.yaml
  script_ownership: All mathematical narration and feedback is authored in this specification.
  caption_policy: Every spoken line is captioned verbatim; empty narration leaves no visible caption container.
  narration_playback: { mode: browser_speech_ryan, require_ryan_voice: true, browser_voice_name: Microsoft Ryan Online (Natural) - English (United Kingdom), opening_delay_ms: 0 }
  production_audio_note: Provider audio and word boundaries require separate owner permission.

visual_language:
  primary_visual_contract: { primitive: percentage_strip, rule: Align ten equal percentage segments with ten equal groups from the same amount and vary only the number selected. }
  scene_rules: [Every selected 10% group has the same size., Show the 10% value before the group multiplication., Do not reveal a scored result before submission.]
  reduced_motion: Show the final selected-group state immediately while retaining all labels.

diagnostic: { enabled: false, question_refs: [], reason: Diagnostic is outside the current implementation scope. }

concept_model:
  core_idea: A multiple of 10% is several unchanged 10% groups selected from the same whole.
  invariant: The value of one 10% group and the original whole stay fixed while the number of selected groups changes.
  mathematical_rule: n × 10% of A = (A ÷ 10) × n.
  must_notice: [Thirty percent uses three equal 10% groups., The group count multiplies the 10% value., Each repeated group comes from the original whole., A percentage below 100% gives less than the positive whole.]
  common_confusions: [Dividing by the stated percentage number., Adding the group count., Taking 10% of the previous 10% result., Selecting the wrong number of groups.]

lesson:
  teaching_steps:
    - id: T01
      stage: teaching
      purpose: Establish ten equal 10% groups.
      estimated_seconds: 40
      scene:
        layout: single_central_teaching_canvas
        display_title: Ten unchanged groups make the whole
        objects: [A whole of 80 counters divided into ten equal groups of 8.]
        initial_state: Select three groups while keeping all group boundaries aligned.
        model: { heading: '30% of 80', percent: 30, wholeAmount: 80, unit: counters, partAmount: 24, partitionCount: 10, selectedGroups: 3, showRoles: true, showResult: true }
      narration: { script: The whole contains ten equal ten-percent groups. For eighty counters, each group contains eight. Thirty percent selects three of those unchanged groups. }
      animation_timeline: [{ id: A01, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 850 }]
      learner_interaction: { question_ref: null }
      next_step: T02

    - id: T02
      stage: teaching
      purpose: Separate group size from group count.
      estimated_seconds: 45
      scene:
        layout: paired_comparison
        display_title: The group value stays the same
        objects: [The same whole of 90 shown with two and seven selected 10% groups.]
        initial_state: Keep each group equal to 9 while changing only the number selected.
        model:
          comparisonDefaults: { showRoles: false, showFormula: false, showResult: true }
          comparisons:
            - { heading: '20%: two groups', percent: 20, wholeAmount: 90, unit: counters, partAmount: 18, partitionCount: 10, selectedGroups: 2, solutionLabel: '2 groups of 9' }
            - { heading: '70%: seven groups', percent: 70, wholeAmount: 90, unit: counters, partAmount: 63, partitionCount: 10, selectedGroups: 7, solutionLabel: '7 groups of 9' }
      narration: { script: Keep the whole at ninety. One ten-percent group is always nine counters. Twenty percent selects two groups, while seventy percent selects seven groups of the same size. }
      animation_timeline: [{ id: A02, trigger: narration_sync, action: contrast, target: percentage_strip, duration_ms: 900 }]
      learner_interaction: { question_ref: null }
      next_step: T03

    - id: T03
      stage: teaching
      purpose: Model the two-stage method.
      estimated_seconds: 45
      scene:
        layout: single_central_teaching_canvas
        display_title: Find one group, then scale it
        objects: [A worked example finding 60% of 90.]
        initial_state: Reveal the 10% value before the group count and result.
        model: { heading: 'Find 60% of 90', percent: 60, wholeAmount: 90, partAmount: 54, partitionCount: 10, selectedGroups: 6, showRoles: true, showResult: true, showMethod: true, methodSteps: ['10% of 90 = 90 ÷ 10 = 9', '60% = 6 equal groups', '9 × 6 = 54'] }
      narration: { script: First find one ten-percent group. Ninety divided by ten is nine. Sixty percent needs six equal groups, so multiply nine by six to get fifty-four. }
      animation_timeline: [{ id: A03, trigger: narration_sync, action: reveal_equation, target: percentage_strip, duration_ms: 900 }]
      learner_interaction: { question_ref: null }
      next_step: T04

    - id: T04
      stage: teaching
      purpose: Emphasise multiplication by the group count.
      estimated_seconds: 35
      scene:
        layout: single_central_teaching_canvas
        display_title: The percentage tells how many groups
        objects: [Six selected groups of 9 from the same whole.]
        initial_state: Highlight six identical selected groups.
        model: { heading: '60% = 6 × 10%', percent: 60, wholeAmount: 90, partAmount: 54, partitionCount: 10, selectedGroups: 6, showRoles: true, showResult: true, showMethod: true, methodSteps: ['One group = 9', 'Six groups = 9 × 6', 'Answer = 54'] }
      narration: { script: The six is a group count. It tells us to use six copies of nine. Adding six to nine would change the meaning of the percentage. }
      animation_timeline: [{ id: A04, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 800 }]
      learner_interaction: { question_ref: null }
      next_step: T05

    - id: T05
      stage: teaching
      purpose: Check the equal-group structure.
      estimated_seconds: 70
      scene: { layout: single_central_teaching_canvas, display_title: What does sixty percent select?, objects: [Ten equal groups with no method shown.], initial_state: Keep the selected-count explanation hidden. }
      narration: { script: Choose the statement that uses six unchanged ten-percent groups. }
      animation_timeline: [{ id: A05, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 650 }]
      learner_interaction: { question_ref: PA-05-C01, auto_focus: true }
      next_step: T06

    - id: T06
      stage: teaching
      purpose: Guide 40% of 130.
      estimated_seconds: 45
      scene:
        layout: single_central_teaching_canvas
        display_title: Four equal groups from one whole
        objects: [A guided example finding 40% of 130.]
        initial_state: Reveal the 10% group value before selecting four groups.
        model: { heading: 'Find 40% of 130', percent: 40, wholeAmount: 130, partAmount: 52, partitionCount: 10, selectedGroups: 4, showRoles: true, showResult: true, showMethod: true, methodSteps: ['130 ÷ 10 = 13', '40% = 4 groups', '13 × 4 = 52'] }
      narration: { script: Ten percent of one hundred and thirty is thirteen. Forty percent selects four equal groups of thirteen, giving fifty-two. }
      animation_timeline: [{ id: A06, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 850 }]
      learner_interaction: { question_ref: null }
      next_step: T07

    - id: T07
      stage: teaching
      purpose: Check group selection.
      estimated_seconds: 70
      scene: { layout: single_central_teaching_canvas, display_title: Map the percentage to its groups, objects: [A ten-part strip for 70%.], initial_state: Keep the selected group count hidden. }
      narration: { script: Choose the statement that maps seventy percent to the correct number of ten-percent groups. }
      animation_timeline: [{ id: A07, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 650 }]
      learner_interaction: { question_ref: PA-05-C02, auto_focus: true }
      next_step: T08

    - id: T08
      stage: teaching
      purpose: Reject a changing-whole method.
      estimated_seconds: 45
      scene:
        layout: single_central_teaching_canvas
        display_title: Repeat the same group, not a smaller one
        objects: [Two equal 10% groups of 6 from a whole of 60.]
        initial_state: Contrast 6 plus 6 with 6 plus 0.6.
        model: { heading: 'Find 20% of 60', percent: 20, wholeAmount: 60, partAmount: 12, partitionCount: 10, selectedGroups: 2, showRoles: true, showResult: true, showMethod: true, methodSteps: ['10% of 60 = 6', 'Second group is also 6', '6 + 6 = 12'] }
      narration: { script: Every ten-percent group comes from the original whole of sixty. The second group is another six, not ten percent of the first group. }
      animation_timeline: [{ id: A08, trigger: narration_sync, action: contrast, target: percentage_strip, duration_ms: 900 }]
      learner_interaction: { question_ref: null }
      next_step: T09

    - id: T09
      stage: teaching
      purpose: Check a multiple independently.
      estimated_seconds: 75
      scene: { layout: single_central_teaching_canvas, display_title: Select seven equal groups yourself, objects: [A ten-part strip for 70% of 120.], initial_state: Keep the 10% value and result hidden. }
      narration: { script: Find seventy percent of one hundred and twenty. Enter the final amount yourself. }
      animation_timeline: [{ id: A09, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 650 }]
      learner_interaction: { question_ref: PA-05-C03, auto_focus: true }
      next_step: T10

    - id: T10
      stage: teaching
      purpose: Hand control to the learner.
      estimated_seconds: 25
      scene: { layout: single_central_teaching_canvas, display_title: Find ten percent, then count groups, objects: [An unsolved ten-part strip.], initial_state: Keep only the equal group boundaries as a cue., model: { heading: 'Your turn', percent: 20, wholeAmount: 65, partitionCount: 10, selectedGroups: 2, showRoles: false, showResult: false } }
      narration: { script: Now find one ten-percent group from the original whole, match the requested percentage to its group count, and scale the unchanged value. }
      animation_timeline: [{ id: A10, trigger: narration_sync, action: crossfade_phase, target: percentage_strip, duration_ms: 700 }]
      learner_interaction: { question_ref: null }
      next_step: G01

  transfer_steps:
    G01: { stage: guided, question_ref: PA-05-G01, support_level: high, estimated_seconds: 80, pre_question_script: Find one ten-percent group, then select two copies., visual_before_answer: Show two selected groups without the result., correct_next: F01, recovery_ref: PA-05-R01 }
    F01: { stage: faded, question_ref: PA-05-F01, support_level: reduced, estimated_seconds: 85, pre_question_script: Find ten percent and use four unchanged groups., visual_before_answer: Show four selected groups without the group value., correct_next: I01, recovery_ref: PA-05-R02 }
    I01: { stage: independent_transfer, question_ref: PA-05-I01, support_level: none, estimated_seconds: 90, pre_question_script: Work independently and keep the decimal result accurate., visual_before_answer: No group value or result is visible., correct_next: P01, recovery_ref: PA-05-R03 }

  practice:
    intro_script: Five questions now. Find ten percent first and keep every repeated group equal.
    question_order: [PA-05-P01, PA-05-P02, PA-05-P03, PA-05-P04, PA-05-P05]
    question_count: 5
    feedback_policy: First errors receive an authored clue; second errors reveal the equal-group method and a focused repair where configured.

  exit:
    intro_script: Final check. Two questions, one submission each, with no hints while you answer.
    primary_question_refs: [PA-05-E01, PA-05-E02]
    confirmation_question_refs: [PA-05-CFM01, PA-05-CFM02]
    submission_policy: One submission per primary exit item; reveal the outcome only after both are complete.
    mastery_logic: { 2_correct_of_2: SECURE, 1_correct_of_2: Ask one unused confirmation item; correct is SECURE and incorrect is NEEDS_WORK., 0_correct_of_2: NEEDS_WORK }
    confirmation_selection: Use the first unseen confirmation item.

completion:
  secure: { title: Skill complete, ryan_script: 'You kept every ten-percent group equal and selected the correct number from the original whole. Multiples of ten percent are ready to use.', state_write: SECURE, buttons: [Finish for today, Continue learning] }
  needs_work: { title: One more pass will help, ryan_script: 'The ten-percent group is visible. We will revisit how the percentage sets the group count before moving on.', state_write: NEEDS_WORK, buttons: [Try this skill again, Finish for today] }

