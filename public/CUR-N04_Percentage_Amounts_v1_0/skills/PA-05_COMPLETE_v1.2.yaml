    stage: practice
    target: Recognise equal group invariance.
    prompt: Which statement is correct?
    response: { type: single_choice, options: [Repeated 10% groups are all calculated from the original whole., Each new 10% group is 10% of the previous group., 60% is found by dividing the whole by 60., 80% contains eighty groups of 10%.] }
    answer: { value: Repeated 10% groups are all calculated from the original whole. }
    attempt_policy: *supported
    scripts: { on_correct_reaction: You kept the original whole fixed., on_correct_math: Every repeated 10% group has the same value., on_incorrect_attempt_1: Ask whether the whole changes between selected groups., on_incorrect_attempt_2: Each group is one tenth of the original whole., worked_explanation: Repeated groups must be equal and come from the same whole. }
