    mathematical_support: { hint_1: Start with 120 ÷ 10., hint_2: Multiply 12 by 7., worked_solution: '84' }
    success_reaction: { mode: authored }
    visual: { primitive: percentage_strip, model: { percent: 70, wholeAmount: 120, partAmount: 84, partitionCount: 10, selectedGroups: 7, methodSteps: ['120 ÷ 10 = 12', '12 × 7 = 84'], solutionLabel: '70% of 120 = 84' } }
