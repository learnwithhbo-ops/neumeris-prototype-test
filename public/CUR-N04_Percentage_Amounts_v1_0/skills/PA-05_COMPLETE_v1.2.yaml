    scripts: { on_correct_reaction: You used four equal groups of eight point five., on_correct_math: '85 ÷ 10 = 8.5, then 8.5 × 4 = 34.', on_incorrect_attempt_1: Find ten percent before selecting four groups., on_incorrect_attempt_2: One group is 8.5; four groups total 34., worked_explanation: '40% of 85 = 34.' }
