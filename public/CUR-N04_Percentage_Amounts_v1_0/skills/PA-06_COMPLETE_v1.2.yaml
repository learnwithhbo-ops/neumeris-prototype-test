schema_version: '1.2'
spec_intent:
  source_of_truth: true
  implementation_status: production_batch_2
  source_material: { title: 'PA 06 - Find 5% and Multiples of 5% of an Amount', path: 'authoring-source-redacted.pdf', authoritative_pages: 1-19 }
  authored_scope: Teach 5% by halving 10%, then build percentages ending in 5 from complete 10% groups and one 5% half-group from the same whole.
  excluded_from_active_route: [Entry check, Diagnostic questions, Delayed retrieval questions, Arbitrary percentages]

identity:
  id: PA-06
  slug: find-five-percent-and-multiples
  title: Find 5% and Multiples of 5% of an Amount
  strand: Number
  cluster: Percentage Amounts
  tier: GCSE Foundation
  status: production_batch_2
  estimated_minutes: { min: 18, max: 24 }

curriculum:
  learning_objective: Find 5% and percentages ending in 5 by finding 10%, halving that value, and combining unchanged benchmark parts from the same original whole.
  success_criteria: [Find 5% by halving the 10% value., Decompose a percentage ending in 5 into complete 10% groups and one 5% half-group., Keep every part tied to the same original whole., Combine the calculated values accurately., Preserve units and check against nearby multiples of 10%.]
  boundaries:
    includes: [5% and positive whole-number multiples of 5% below 100%, Whole-number and simple decimal results, Direct calculations and short GCSE-style contexts]
    excludes: [Arbitrary percentages not divisible by 5%, Required general 1% or decimal-multiplier methods, Money conventions, Percentage change and reverse percentages]

dependencies:
  required_skill_refs: [PA-01, PA-02, PA-05]
  entry_assumptions: [The learner can find 10% of an amount, The learner can form a multiple of 10%, The learner can halve whole numbers and simple decimals]
  downstream_rule: PA-07 may combine the 5% benchmark with other benchmark parts; PA-06 keeps the taught construction to 10% groups and a 5% half-group.

engine_capability_requirements:
  input_types: [single_choice, decimal]
  visual_primitives: [percentage_strip, caption_layer, progress_indicator]
  animation_actions: [fade_in, highlight, reveal_equation, contrast, crossfade_phase]
  audio_capabilities: [browser_speech, caption_sync, pause_for_input, cancel_on_navigation]
  state_capabilities: [attempt_count, step_resume, exit_score, confirmation_branch]

experience_contract:
  authored_feedback_only: true
  ordered_phases: [teaching, guided, faded, independent_transfer, practice, exit, completion]
  navigation: { default: linear_forward, refresh_resume: Resume at the latest committed step., start_again: Reset only this lesson attempt and preserve historical completion records. }
  interaction_rules: [Never auto-submit or auto-fill an answer., Keep input available while Ryan speaks., Keep every 10% group and 5% half-group tied to the original whole., Accept any mathematically valid method unless a prompt explicitly checks the benchmark construction.]

voice_and_script:
  performer_name: Ryan
  dialogue_profile_ref: RYAN_DIALOGUE_PROFILE_v1.yaml
  script_ownership: All mathematical narration and feedback is authored in this specification.
  caption_policy: Every spoken line is captioned verbatim; empty narration leaves no visible caption container.
  narration_playback: { mode: browser_speech_ryan, require_ryan_voice: true, browser_voice_name: 'Microsoft Ryan Online (Natural) - English (United Kingdom)', opening_delay_ms: 0 }
  production_audio_note: Provider audio and word boundaries require separate owner permission.

visual_language:
  primary_visual_contract: { primitive: percentage_strip, rule: Divide the whole into twenty equal 5% cells, use a stronger boundary after every pair to show one 10% group, and vary only the cells selected. }
  scene_rules: [Two 5% cells must visibly form one unchanged 10% group., Show the 10% value before halving it., Keep results hidden on scored prompts until submission., Use the same whole for every benchmark part.]
  reduced_motion: Show the final selected-cell state immediately while retaining the paired-group boundaries and labels.

diagnostic: { enabled: false, question_refs: [], reason: Diagnostic is outside the current implementation scope. }

concept_model:
  core_idea: One 10% group contains two equal 5% halves, so a percentage ending in 5 is complete 10% groups plus one 5% half-group.
  invariant: The original whole fixes the values of both 10% and 5%; neither value changes as more groups are selected.
  mathematical_rule: '5% of A = (A ÷ 10) ÷ 2; (10n + 5)% of A = n(A ÷ 10) + ((A ÷ 10) ÷ 2).'
  must_notice: [Five percent is half of ten percent, not one fifth., Thirty-five percent uses three 10% groups and one 5% half-group., The final 5 names a percentage part rather than an amount to add., A percentage below 100% gives less than a positive whole.]
  common_confusions: [Dividing the whole by 5., Finding 5% of the 10% result., Selecting the wrong number of 10% groups., Adding the numeral 5., Dropping the unit.]

lesson:
  teaching_steps:
    - id: T01
      stage: teaching
      purpose: Establish that one 10% group contains two equal 5% halves.
      estimated_seconds: 45
      scene:
        layout: paired_comparison
        display_title: One ten-percent group splits into two equal halves
        objects: [The same whole of 120 shown with 10% and 5% selected.]
        initial_state: Keep twenty equal cells visible and place a stronger boundary after every pair.
        model:
          comparisonDefaults: { showRoles: false, showFormula: false, showResult: true, partitionCount: 20, majorEvery: 2 }
          comparisons:
            - { heading: '10% of 120', percent: 10, wholeAmount: 120, unit: counters, partAmount: 12, selectedGroups: 2, solutionLabel: 'Two 5% halves make 12 counters' }
            - { heading: '5% of 120', percent: 5, wholeAmount: 120, unit: counters, partAmount: 6, selectedGroups: 1, solutionLabel: 'One equal half contains 6 counters' }
      narration: { script: One ten-percent group can be cut into two equal halves. Each half is five percent of the same whole, so its value is half of the ten-percent value. }
      animation_timeline: [{ id: A01, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 850 }]
      learner_interaction: { question_ref: null }
      next_step: T02

    - id: T02
      stage: teaching
      purpose: Build 35% from full groups and one half-group.
      estimated_seconds: 45
      scene:
        layout: single_central_teaching_canvas
        display_title: Build a percentage ending in five
        objects: [Three complete 10% groups and one additional 5% half-group from a whole of 120.]
        initial_state: Select seven 5% cells while retaining the stronger boundaries between 10% groups.
        model: { heading: '35% of 120', percent: 35, wholeAmount: 120, unit: counters, partAmount: 42, partitionCount: 20, selectedGroups: 7, majorEvery: 2, showRoles: true, showResult: true, showMethod: true, methodSteps: ['10% of 120 = 12', '5% of 120 = 6', '30% + 5% = 36 + 6 = 42'] }
      narration: { script: Thirty-five percent uses three complete ten-percent groups and one extra five-percent half. All four parts come from the original whole, so the last half is six counters. }
      animation_timeline: [{ id: A02, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 900 }]
      learner_interaction: { question_ref: null }
      next_step: T03

    - id: T03
      stage: teaching
      purpose: Check the benchmark structure.
      estimated_seconds: 70
      scene: { layout: single_central_teaching_canvas, display_title: Which parts make forty-five percent?, objects: [Twenty equal 5% cells grouped in pairs.], initial_state: Keep the correct decomposition and result hidden. }
      narration: { script: Choose the statement that uses complete ten-percent groups and one five-percent half from the same whole. }
      animation_timeline: [{ id: A03, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 650 }]
      learner_interaction: { question_ref: PA-06-C01, auto_focus: true }
      next_step: T04

    - id: T04
      stage: teaching
      purpose: Model the approved method for 35% of 120.
      estimated_seconds: 50
      scene:
        layout: single_central_teaching_canvas
        display_title: Find ten percent, halve it, then combine
        objects: [A locked worked example for 35% of 120.]
        initial_state: Reveal the benchmark values before the final total.
        model: { heading: 'Worked example: 35% of 120', percent: 35, wholeAmount: 120, partAmount: 42, partitionCount: 20, selectedGroups: 7, majorEvery: 2, showRoles: true, showResult: true, showMethod: true, methodSteps: ['120 ÷ 10 = 12', '12 ÷ 2 = 6', '(3 × 12) + 6 = 42'] }
      narration: { script: Start with one ten-percent group, then halve that group value for five percent. Three full groups and the half-group combine to give the required amount. }
      animation_timeline: [{ id: A04, trigger: narration_sync, action: reveal_equation, target: percentage_strip, duration_ms: 900 }]
      learner_interaction: { question_ref: null }
      next_step: T05

    - id: T05
      stage: teaching
      purpose: Check method selection without forcing it on open calculations.
      estimated_seconds: 70
      scene: { layout: single_central_teaching_canvas, display_title: Select the benchmark calculation, objects: [A 35% strip for a whole of 120.], initial_state: Keep all method steps hidden. }
      narration: { script: This check asks specifically for the ten-percent-and-five-percent benchmark route. Choose the calculation that keeps both parts tied to one hundred and twenty. }
      animation_timeline: [{ id: A05, trigger: narration_sync, action: contrast, target: percentage_strip, duration_ms: 650 }]
      learner_interaction: { question_ref: PA-06-C02, auto_focus: true }
      next_step: T06

    - id: T06
      stage: teaching
      purpose: Guide 65% of 140 in deliberate stages.
      estimated_seconds: 50
      scene:
        layout: single_central_teaching_canvas
        display_title: Six full groups and one half-group
        objects: [A guided model for 65% of 140.]
        initial_state: Show the 10% and 5% values before the six-group total and final addition.
        model: { heading: 'Guided example: 65% of 140', percent: 65, wholeAmount: 140, partAmount: 91, partitionCount: 20, selectedGroups: 13, majorEvery: 2, showRoles: true, showResult: true, showMethod: true, methodSteps: ['10% = 14 and 5% = 7', '60% = 6 × 14 = 84', '65% = 84 + 7 = 91'] }
      narration: { script: For this whole, ten percent is fourteen and its half is seven. Sixty-five percent takes six complete groups and one half-group, all unchanged. }
      animation_timeline: [{ id: A06, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 850 }]
      learner_interaction: { question_ref: null }
      next_step: T07

    - id: T07
      stage: teaching
      purpose: Check that 5% is halved from 10% rather than taken from a changed whole.
      estimated_seconds: 70
      scene: { layout: single_central_teaching_canvas, display_title: Keep the original whole fixed, objects: [One paired 10% group divided into equal 5% cells.], initial_state: Keep the half value hidden. }
      narration: { script: Ten percent of an amount is already known. Choose the five-percent value that halves it without changing the whole. }
      animation_timeline: [{ id: A07, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 650 }]
      learner_interaction: { question_ref: PA-06-C03, auto_focus: true }
      next_step: T08

    - id: T08
      stage: teaching
      purpose: Add a nearby-benchmark reasonableness check.
      estimated_seconds: 40
      scene:
        layout: paired_comparison
        display_title: Check between nearby multiples of ten percent
        objects: [30%, 35% and 40% of the same whole of 200.]
        initial_state: Keep the whole unchanged across all comparison panels.
        model:
          comparisonDefaults: { showRoles: false, showFormula: false, showResult: true, partitionCount: 20, majorEvery: 2 }
          comparisons:
            - { heading: '30% of 200', percent: 30, wholeAmount: 200, partAmount: 60, selectedGroups: 6, solutionLabel: 'Lower benchmark: 60' }
            - { heading: '35% of 200', percent: 35, wholeAmount: 200, partAmount: 70, selectedGroups: 7, solutionLabel: 'Target: 70' }
            - { heading: '40% of 200', percent: 40, wholeAmount: 200, partAmount: 80, selectedGroups: 8, solutionLabel: 'Upper benchmark: 80' }
      narration: { script: For a positive whole, thirty-five percent must lie between thirty and forty percent. Nearby benchmark values make a quick check on the result. }
      animation_timeline: [{ id: A08, trigger: narration_sync, action: contrast, target: percentage_strip, duration_ms: 850 }]
      learner_interaction: { question_ref: null }
      next_step: T09

    - id: T09
      stage: teaching
      purpose: Prepare for a decimal half without changing the structure.
      estimated_seconds: 40
      scene:
        layout: single_central_teaching_canvas
        display_title: The half-group can have a decimal value
        objects: [55% of 90 represented by eleven 5% cells.]
        initial_state: Retain the paired boundaries while showing a decimal 5% value.
        model: { heading: '55% of 90', percent: 55, wholeAmount: 90, partAmount: 49.5, partitionCount: 20, selectedGroups: 11, majorEvery: 2, showRoles: true, showResult: true, showMethod: true, methodSteps: ['10% of 90 = 9', '5% of 90 = 4.5', '50% + 5% = 45 + 4.5 = 49.5'] }
      narration: { script: The structure does not change when the half is a decimal. Half of the ten-percent value still gives five percent of the original whole. }
      animation_timeline: [{ id: A09, trigger: narration_sync, action: crossfade_phase, target: percentage_strip, duration_ms: 850 }]
      learner_interaction: { question_ref: null }
      next_step: T10

    - id: T10
      stage: teaching
      purpose: Consolidate the method before supported transfer.
      estimated_seconds: 35
      scene:
        layout: single_central_teaching_canvas
        display_title: Your benchmark plan
        objects: [A 15% strip with one full pair and one half-cell selected.]
        initial_state: Show the decomposition and withhold the amount.
        model: { heading: '15% = 10% + 5%', percent: 15, wholeAmount: 180, partAmount: 27, partitionCount: 20, selectedGroups: 3, majorEvery: 2, showRoles: true, showResult: false, methodSteps: ['Find 10% from the whole', 'Halve it to find 5%', 'Combine the selected parts'] }
      narration: { script: Find ten percent from the whole, halve that value for five percent, then combine the number of full and half-groups named by the target. You will now use that plan yourself. }
      animation_timeline: [{ id: A10, trigger: narration_sync, action: fade_in, target: percentage_strip, duration_ms: 700 }]
      learner_interaction: { question_ref: null }
      next_step: G01

  transfer_steps:
    G01: { stage: guided, question_ref: PA-06-G01, support_level: high, estimated_seconds: 80, pre_question_script: Find ten percent, halve it, then combine the two benchmark parts., visual_before_answer: Show one complete group and one half-group without their values., correct_next: F01, recovery_ref: PA-06-R02 }
    F01: { stage: faded, question_ref: PA-06-F01, support_level: reduced, estimated_seconds: 85, pre_question_script: Work out the benchmark values and use four complete groups plus one half., visual_before_answer: Show nine selected 5% cells without the result., correct_next: I01, recovery_ref: PA-06-R03 }
    I01: { stage: independent_transfer, question_ref: PA-06-I01, support_level: none, estimated_seconds: 90, pre_question_script: Work independently and keep the decimal half accurate., visual_before_answer: No benchmark values or result are visible., correct_next: P01, recovery_ref: PA-06-R02 }

  practice:
    intro_script: Five questions now. Use the original whole for every ten-percent group and five-percent half.
    question_order: [PA-06-P01, PA-06-P02, PA-06-P03, PA-06-P04, PA-06-P05]
    question_count: 5
    feedback_policy: First errors receive an authored clue; second errors reveal the benchmark working and a focused repair where configured.

  exit:
    intro_script: Final check. Two questions, one submission each, with no hints while you answer.
    primary_question_refs: [PA-06-E01, PA-06-E02]
    confirmation_question_refs: [PA-06-CFM01, PA-06-CFM02]
    submission_policy: One submission per primary exit item; reveal the outcome only after both are complete.
    mastery_logic: { 2_correct_of_2: SECURE, 1_correct_of_2: Ask one unused confirmation item; correct is SECURE and incorrect is NEEDS_WORK., 0_correct_of_2: NEEDS_WORK }
    confirmation_selection: Use the first unseen confirmation item.

completion:
  secure: { title: Skill complete, ryan_script: 'You found five percent by halving ten percent, then combined full and half-groups from one unchanged whole. Multiples of five percent are ready to use.', state_write: SECURE, buttons: [Finish for today, Continue learning] }
  needs_work: { title: One more pass will help, ryan_script: 'The paired benchmark model is ready. We will revisit how the ten-percent group splits and how the selected parts combine.', state_write: NEEDS_WORK, buttons: [Try this skill again, Finish for today] }

