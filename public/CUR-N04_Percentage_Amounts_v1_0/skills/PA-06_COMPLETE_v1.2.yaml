    scripts: { on_correct_reaction: You separated the full groups from the final half-group., on_correct_math: '45% = 4 × 10% + 5%, with every part from the same whole.', on_incorrect_attempt_1: Count the complete tens in forty-five, then account for the final five., on_incorrect_attempt_2: Forty-five percent uses four complete ten-percent groups and one five-percent half-group., worked_explanation: '45% = 40% + 5% = 4 × 10% + 5%.' }
