  - id: PA-02-P03
    stage: practice
    target: Calculate a measured decimal result.
    prompt: A roll of material is 87 metres long. A designer uses 10%. How many metres are used?
    response: { type: decimal, input_label: Answer in metres }
    answer: { value: '8.7' }
    attempt_policy: *supported
    scripts: { on_correct_reaction: You retained both the decimal and the metre unit., on_correct_math: '87 ÷ 10 = 8.7 metres.', on_incorrect_attempt_1: Divide 87 by 10 and keep the 7 as tenths., on_incorrect_attempt_2: The result is 8.7 metres., worked_explanation: '10% of 87 m = 87 ÷ 10 = 8.7 m.' }
    mathematical_support: { hint_1: The 7 units become 7 tenths., hint_2: The answer is between 8 and 9 metres., worked_solution: '8.7 metres.' }
    success_reaction: { mode: authored }
    visual: { primitive: percentage_strip, model: { percent: 10, wholeAmount: 87, unit: metres, partAmount: 8.7, partitionCount: 10, selectedGroups: 1, solutionLabel: '10% of 87 metres = 8.7 metres' } }

  - id: PA-02-P04
    stage: practice
