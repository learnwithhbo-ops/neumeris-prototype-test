schema_version: '1.2'
spec_intent:
  source_of_truth: true
  implementation_status: production_batch_1
  source_material:
    title: PA 02 — Find 10% of an Amount
    path: authoring-source-redacted.pdf
    authoritative_pages: 1-17
  authored_scope: Teach 10% as one of ten equal shares and calculate it by dividing the whole by 10 with correct place value and units.
  excluded_from_active_route:
    - Diagnostic questions
    - Delayed retrieval questions
    - Percentages other than exactly 10%

identity:
  id: PA-02
  slug: find-ten-percent-of-an-amount
  title: Find 10% of an Amount
  strand: Number
  cluster: Percentage Amounts
  tier: GCSE Foundation
  status: production_batch_1
  estimated_minutes: { min: 16, max: 22 }

curriculum:
  learning_objective: Find 10% of a stated amount by recognising that 10% = 1/10 and dividing the whole by 10 with correct place value and units.
  success_criteria:
    - Identify the complete amount representing 100%.
    - Explain that ten equal 10% shares make the whole.
    - Divide the whole by 10 using place value.
    - Preserve decimal place value and contextual units.
  boundaries:
    includes:
      - Exactly 10% of positive whole-number amounts.
      - Whole-number and one-decimal-place results.
      - Counts and simple measured quantities.
    excludes:
      - Finding 1%, 5% or multiples of 10%.
      - Money-specific conventions and contextual rounding.
      - Percentage change, reverse percentages and expressing one amount as a percentage of another.

dependencies:
  required_skill_refs: [PA-01]
  entry_assumptions:
    - The learner can identify the whole amount.
    - The learner understands that 100% represents the whole.
  downstream_rule: PA-03 and PA-05 may depend on this skill; this lesson teaches exactly 10% only.

engine_capability_requirements:
  input_types: [single_choice, decimal]
  visual_primitives: [percentage_strip, caption_layer, progress_indicator]
  animation_actions: [fade_in, highlight, reveal_equation, crossfade_phase]
  audio_capabilities: [browser_speech, caption_sync, pause_for_input, cancel_on_navigation]
  state_capabilities: [attempt_count, step_resume, exit_score, confirmation_branch]

experience_contract:
  authored_feedback_only: true
  ordered_phases: [teaching, guided, faded, independent_transfer, practice, exit, completion]
  navigation:
    default: linear_forward
    refresh_resume: Resume at the latest committed step.
    start_again: Reset only this lesson attempt and preserve historical completion records.
  interaction_rules:
    - Never auto-submit or auto-fill an answer.
    - Keep input available while Ryan speaks.
    - Reveal the result and method only after the appropriate feedback stage.

voice_and_script:
  performer_name: Ryan
  dialogue_profile_ref: RYAN_DIALOGUE_PROFILE_v1.yaml
  script_ownership: All mathematical narration and feedback is authored in this specification.
  caption_policy: Every spoken line is captioned verbatim; empty narration leaves no visible caption container.
  narration_playback:
    mode: browser_speech_ryan
    require_ryan_voice: true
    browser_voice_name: Microsoft Ryan Online (Natural) - English (United Kingdom)
    opening_delay_ms: 0
  production_audio_note: Provider audio and word boundaries require separate owner permission.

visual_language:
  primary_visual_contract:
    primitive: percentage_strip
    rule: Keep the amount aligned to ten equal percentage groups and show one unchanged 10% share.
  scene_rules:
    - Use ten equal segments whenever the method is being taught.
    - Show decimal place-value movement as a change in value, never as deleting a digit.
    - Do not reveal a scored result before submission.
  reduced_motion: Show the same complete partition and method state without width transitions.

diagnostic:
  enabled: false
  question_refs: []
  reason: Diagnostic is outside the current implementation scope.

concept_model:
  core_idea: Ten equal 10% shares make the complete whole, so one 10% share is one tenth of the whole.
  invariant: The original whole remains fixed while every digit becomes one tenth as valuable.
  mathematical_rule: 10% of A = A ÷ 10.
  must_notice:
    - 10% = 10/100 = 1/10.
    - Division by 10 changes every digit's place value.
    - A positive 10% result is smaller than the whole.
    - The contextual unit is unchanged.
  common_confusions:
    - Dividing by 100 instead of 10.
    - Multiplying by 10.
    - Removing a final digit as a general rule.
    - Dropping or changing the unit.

lesson:
  teaching_steps:
    - id: T01
      stage: teaching
      purpose: Establish ten equal shares of one whole.
      estimated_seconds: 35
      scene:
        layout: single_central_teaching_canvas
        display_title: Ten equal shares make the whole
        objects: [A whole of 200 units split into ten equal groups.]
        initial_state: Show all ten equal groups and select one group.
        model: { heading: '100% split into ten equal shares', percent: 10, wholeAmount: 200, unit: units, partAmount: 20, partitionCount: 10, selectedGroups: 1, showRoles: true, showResult: true }
      narration:
        script: Ten equal ten-percent shares make the complete whole. One selected share is ten percent, which is one tenth of the whole.
        sync_cues: [{ cue: one selected share, action: highlight }]
      animation_timeline: [{ id: A01, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 750 }]
      learner_interaction: { question_ref: null }
      next_step: T02

    - id: T02
      stage: teaching
      purpose: Connect one tenth to division by 10.
      estimated_seconds: 35
      scene:
        layout: single_central_teaching_canvas
        display_title: Select one of the ten groups
        objects: [One of ten equal groups from 200.]
        initial_state: Keep one group selected and reveal its value.
        model:
          heading: One 10% group from 200
          percent: 10
          wholeAmount: 200
          unit: units
          partAmount: 20
          partitionCount: 10
          selectedGroups: 1
          showRoles: true
          showResult: true
          showMethod: true
          methodSteps: ['10% = 1/10', '200 ÷ 10 = 20']
      narration:
        script: To find one of ten equal shares, divide the whole by ten. Two hundred divided by ten is twenty, so ten percent of two hundred is twenty.
        sync_cues: [{ cue: divide the whole by ten, action: reveal_equation }]
      animation_timeline: [{ id: A02, trigger: narration_sync, action: reveal_equation, target: percentage_strip, duration_ms: 800 }]
      learner_interaction: { question_ref: null }
      next_step: T03

    - id: T03
      stage: teaching
      purpose: Explain a decimal result through place value.
      estimated_seconds: 45
      scene:
        layout: single_central_teaching_canvas
        display_title: Every digit becomes one tenth as valuable
        objects: [The place-value change from 84 to 8.4.]
        initial_state: Reveal the tens-to-units and units-to-tenths changes in sequence.
        model:
          heading: 10% of 84
          percent: 10
          wholeAmount: 84
          partAmount: 8.4
          partitionCount: 10
          selectedGroups: 1
          showRoles: true
          showResult: true
          showMethod: true
          methodSteps: ['8 tens become 8 units', '4 units become 4 tenths', '84 ÷ 10 = 8.4']
      narration:
        script: Dividing by ten does not erase a digit. The eight tens become eight units, and the four units become four tenths. That gives eight point four.
        sync_cues: [{ cue: eight tens, action: highlight }]
      animation_timeline: [{ id: A03, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 850 }]
      learner_interaction: { question_ref: null }
      next_step: T04

    - id: T04
      stage: teaching
      purpose: Model the complete method on a new amount.
      estimated_seconds: 40
      scene:
        layout: single_central_teaching_canvas
        display_title: Identify, divide, answer
        objects: [A worked example finding 10% of 350.]
        initial_state: Reveal one immediately useful step at a time.
        model:
          heading: Find 10% of 350
          percent: 10
          wholeAmount: 350
          partAmount: 35
          partitionCount: 10
          selectedGroups: 1
          showRoles: true
          showResult: true
          showMethod: true
          methodSteps: ['Whole = 350', '10% = 1/10', '350 ÷ 10 = 35']
      narration:
        script: The whole is three hundred and fifty. Ten percent is one tenth, so divide the whole by ten. The required part is thirty-five.
        sync_cues: [{ cue: divide the whole, action: reveal_equation }]
      animation_timeline: [{ id: A04, trigger: narration_sync, action: reveal_equation, target: percentage_strip, duration_ms: 800 }]
      learner_interaction: { question_ref: null }
      next_step: T05

    - id: T05
      stage: teaching
      purpose: Check the equal-share meaning.
      estimated_seconds: 70
      scene: { layout: single_central_teaching_canvas, display_title: Why divide by ten?, objects: [Ten equal groups with no answer label.], initial_state: Keep the explanation hidden until submission. }
      narration: { script: Choose the statement that explains the division, not a surface shortcut. }
      animation_timeline: [{ id: A05, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 650 }]
      learner_interaction: { question_ref: PA-02-C01, auto_focus: true }
      next_step: T06

    - id: T06
      stage: teaching
      purpose: Guide a non-multiple of ten using place value.
      estimated_seconds: 45
      scene:
        layout: single_central_teaching_canvas
        display_title: Keep the decimal place value accurate
        objects: [A guided example finding 10% of 86.]
        initial_state: Show the whole and one selected tenth before the result.
        model: { heading: 'Find 10% of 86', percent: 10, wholeAmount: 86, partAmount: 8.6, partitionCount: 10, selectedGroups: 1, showRoles: true, showResult: true, showMethod: true, methodSteps: ['86 ÷ 10', '8 tens → 8 units', '6 units → 6 tenths', 'Answer = 8.6'] }
      narration:
        script: Eighty-six does not end in zero, but the method is unchanged. Divide by ten and follow each digit's value to get eight point six.
        sync_cues: [{ cue: follow each digit, action: highlight }]
      animation_timeline: [{ id: A06, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 850 }]
      learner_interaction: { question_ref: null }
      next_step: T07

    - id: T07
      stage: teaching
      purpose: Check the place-value explanation.
      estimated_seconds: 70
      scene: { layout: single_central_teaching_canvas, display_title: Explain 8.6, objects: [A neutral 10% strip for 86.], initial_state: Hide the decimal result before submission. }
      narration: { script: Decide which explanation follows the place value of both digits. }
      animation_timeline: [{ id: A07, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 650 }]
      learner_interaction: { question_ref: PA-02-C02, auto_focus: true }
      next_step: T08

    - id: T08
      stage: teaching
      purpose: Transfer the method to a contextual whole.
      estimated_seconds: 40
      scene:
        layout: single_central_teaching_canvas
        display_title: The unit stays with the quantity
        objects: [A theatre with 680 seats represented as the whole.]
        initial_state: Reveal one tenth while keeping the unit seats.
        model: { heading: '10% of 680 seats', percent: 10, wholeAmount: 680, unit: seats, partAmount: 68, partitionCount: 10, selectedGroups: 1, showRoles: true, showResult: true, showMethod: true, methodSteps: ['680 ÷ 10 = 68', 'Answer = 68 seats'] }
      narration:
        script: The theatre has six hundred and eighty seats as its whole. Divide by ten, then keep the unit. The selected group contains sixty-eight seats.
        sync_cues: [{ cue: keep the unit, action: highlight }]
      animation_timeline: [{ id: A08, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 800 }]
      learner_interaction: { question_ref: null }
      next_step: T09

    - id: T09
      stage: teaching
      purpose: Check an unsupported decimal calculation.
      estimated_seconds: 75
      scene: { layout: single_central_teaching_canvas, display_title: Find one tenth independently, objects: [A ten-part strip for 93.], initial_state: Show no result or method before submission. }
      narration: { script: Find ten percent of ninety-three. Use place value, and enter the number yourself. }
      animation_timeline: [{ id: A09, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 650 }]
      learner_interaction: { question_ref: PA-02-C03, auto_focus: true }
      next_step: T10

    - id: T10
      stage: teaching
      purpose: Hand control to the learner.
      estimated_seconds: 25
      scene:
        layout: single_central_teaching_canvas
        display_title: One whole, one tenth, same unit
        objects: [A compact unsolved ten-part strip.]
        initial_state: Keep only the ten equal partitions as a cue.
        model: { heading: 'Your turn', percent: 10, wholeAmount: 470, partitionCount: 10, selectedGroups: 1, showRoles: false, showResult: false }
      narration: { script: Now use the same structure yourself. Identify the whole, divide by ten, and check that your answer is one tenth as large. }
      animation_timeline: [{ id: A10, trigger: narration_sync, action: crossfade_phase, target: percentage_strip, duration_ms: 700 }]
      learner_interaction: { question_ref: null }
      next_step: G01

  transfer_steps:
    G01: { stage: guided, question_ref: PA-02-G01, support_level: high, estimated_seconds: 80, pre_question_script: 'Use the ten equal groups: one group is the whole divided by ten.', visual_before_answer: Show the ten partitions without the result., correct_next: F01, recovery_ref: PA-02-R01 }
    F01: { stage: faded, question_ref: PA-02-F01, support_level: reduced, estimated_seconds: 85, pre_question_script: Follow every digit across one place-value position., visual_before_answer: Show only the whole and selected tenth., correct_next: I01, recovery_ref: PA-02-R03 }
    I01: { stage: independent_transfer, question_ref: PA-02-I01, support_level: none, estimated_seconds: 90, pre_question_script: Work independently and retain the contextual unit., visual_before_answer: No result or method is visible., correct_next: P01, recovery_ref: PA-02-R02 }

  practice:
    intro_script: Five questions now. Find one tenth of the correct whole and keep the place value accurate.
    question_order: [PA-02-P01, PA-02-P02, PA-02-P03, PA-02-P04, PA-02-P05]
    question_count: 5
    feedback_policy: First errors receive an authored clue; second errors reveal the method and route to a focused repair where configured.

  exit:
    intro_script: Final check. Two questions, one submission each, with no hints while you answer.
    primary_question_refs: [PA-02-E01, PA-02-E02]
    confirmation_question_refs: [PA-02-CFM01, PA-02-CFM02]
    submission_policy: One submission per primary exit item; reveal the outcome only after both are complete.
    mastery_logic:
      2_correct_of_2: SECURE
      1_correct_of_2: Ask one unused confirmation item; correct is SECURE and incorrect is NEEDS_WORK.
      0_correct_of_2: NEEDS_WORK
    confirmation_selection: Use the first unseen confirmation item.

completion:
  secure: { title: Skill complete, ryan_script: 'You used one tenth of the correct whole and kept the place value accurate. Ten percent is ready to use in the next percentage skill.', state_write: SECURE, buttons: [Finish for today, Continue learning] }
  needs_work: { title: One more pass will help, ryan_script: 'The ten equal shares are in place. We will revisit the division and decimal position before moving on.', state_write: NEEDS_WORK, buttons: [Try this skill again, Finish for today] }

question_bank:
  - id: PA-02-C01
    stage: teaching_checkpoint
    target: Explain why finding 10% uses division by 10.
    prompt: Why does finding 10% of an amount involve division by 10?
    response: { type: single_choice, options: [Because 10% means ten times the whole., Because the whole is split into ten equal shares and one share is selected., Because every percentage calculation uses division by 10., Because the final digit must always be removed.] }
    answer: { value: Because the whole is split into ten equal shares and one share is selected. }
    attempt_policy: &supported { policy: two_attempt_then_targeted_repair, max_attempts_before_resolution: 2, feedback_timing: immediate, submit_label: Check answer, allow_change_before_submit: true, lock_after_final_submit: true }
    scripts: &c01scripts
      on_correct_reaction: You connected the operation to the equal-share structure.
      on_correct_math: Ten equal 10% groups make the whole, so one group is found by dividing by 10.
      on_incorrect_attempt_1: Think about how many equal 10% groups make 100%.
      on_incorrect_attempt_2: Ten equal groups make the whole, and 10% selects one of them.
      worked_explanation: The whole is divided into ten equal shares. One share is 1/10, which is 10%.
    mathematical_support: { hint_1: How many copies of 10% make 100%?, hint_2: One selected group out of ten equal groups is one tenth., worked_solution: '10% = 1/10, so divide the whole by 10.' }
    success_reaction: { mode: authored }
    visual: { primitive: percentage_strip, model: { percent: 10, wholeAmount: 200, unit: units, partAmount: 20, partitionCount: 10, selectedGroups: 1, showRoles: false, showResult: false, showMethod: false, methodSteps: ['10% = 1/10', '200 ÷ 10 = 20'], solutionLabel: '10% = one of ten equal shares' } }
    recovery_item_ref: PA-02-R01

  - id: PA-02-C02
    stage: teaching_checkpoint
    target: Explain division by 10 through place value.
    prompt: A student says, “I removed the final digit from 86, so the answer is 8.” Which response is correct?
    response: { type: single_choice, options: [The answer is 8 because dividing by 10 always removes the last digit., The answer is 8.6 because 8 tens become 8 units and 6 units become 6 tenths., The answer is 0.86 because percentages always divide by 100., The answer is 860 because 10% means multiply by 10.] }
    answer: { value: The answer is 8.6 because 8 tens become 8 units and 6 units become 6 tenths. }
    attempt_policy: *supported
    scripts:
      on_correct_reaction: You followed the value of both digits.
      on_correct_math: Eight tens become eight units and six units become six tenths, giving 8.6.
      on_incorrect_attempt_1: Track the value of the 8 and the 6 instead of deleting either digit.
      on_incorrect_attempt_2: Dividing 86 by 10 makes every digit one tenth as valuable, so the result is 8.6.
      worked_explanation: 86 ÷ 10 = 8.6 because tens become units and units become tenths.
    mathematical_support: { hint_1: Where does the 6 move when its value becomes one tenth as large?, hint_2: The 6 units become 6 tenths., worked_solution: '86 ÷ 10 = 8.6.' }
    success_reaction: { mode: authored }
    visual: { primitive: percentage_strip, model: { percent: 10, wholeAmount: 86, partAmount: 8.6, partitionCount: 10, selectedGroups: 1, showRoles: false, showResult: false, showMethod: false, methodSteps: ['8 tens → 8 units', '6 units → 6 tenths', '86 ÷ 10 = 8.6'], solutionLabel: '10% of 86 = 8.6' } }
    recovery_item_ref: PA-02-R03

  - id: PA-02-C03
    stage: teaching_checkpoint
    target: Calculate a decimal 10% result independently.
    prompt: Find 10% of 93.
    response: { type: decimal, input_label: Your answer }
    answer: { value: '9.3' }
    attempt_policy: *supported
    scripts: &numeric_scripts
      on_correct_reaction: Your result is one tenth of the whole.
      on_correct_math: Dividing 93 by 10 gives 9.3.
      on_incorrect_attempt_1: Divide the whole by 10 and keep both digits in the number.
      on_incorrect_attempt_2: Each digit moves one place in value, so 93 ÷ 10 = 9.3.
      worked_explanation: The 9 tens become 9 units and the 3 units become 3 tenths.
    mathematical_support: { hint_1: Make every digit one tenth as valuable., hint_2: The answer needs a tenths digit., worked_solution: '93 ÷ 10 = 9.3.' }
    success_reaction: { mode: authored }
    visual: { primitive: percentage_strip, model: { percent: 10, wholeAmount: 93, partAmount: 9.3, partitionCount: 10, selectedGroups: 1, showRoles: false, showResult: false, showMethod: false, methodSteps: ['93 ÷ 10 = 9.3'], solutionLabel: '10% of 93 = 9.3' } }
    recovery_item_ref: PA-02-R03

