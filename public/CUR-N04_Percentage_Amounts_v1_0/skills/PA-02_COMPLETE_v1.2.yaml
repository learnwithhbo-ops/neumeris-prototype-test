    response: { type: decimal, input_label: Your answer }
    answer: { value: '47' }
    attempt_policy: *supported
    scripts: { on_correct_reaction: You selected one equal tenth., on_correct_math: '470 ÷ 10 = 47.', on_incorrect_attempt_1: Find one of the ten equal groups., on_incorrect_attempt_2: Divide 470 by 10 to get 47., worked_explanation: '10% = 1/10, so 470 ÷ 10 = 47.' }
    mathematical_support: { hint_1: Use whole ÷ 10., hint_2: Make each digit one tenth as valuable., worked_solution: '470 ÷ 10 = 47.' }
