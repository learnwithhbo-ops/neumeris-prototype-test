  - id: PA-02-P02
    stage: practice
    target: Select the correct operation.
    prompt: Which calculation finds 10% of 540?
    response: { type: single_choice, options: ['540 ÷ 100', '540 ÷ 10', '540 × 10', '540 − 10'] }
