    recovery_item_ref: PA-04-R02

  - id: PA-04-C02
    stage: teaching_checkpoint
    target: Combine benchmark parts from the same whole.
    prompt: Which alternative calculation also finds 75% of 52?
    response: { type: single_choice, options: [Find 50% of 52 and 25% of 52, then add the two parts., Find 50% of 52 and 25% of 26, then add the two parts., Divide 52 by 75., Subtract 75 from 52.] }
    answer: { value: Find 50% of 52 and 25% of 52, then add the two parts. }
    attempt_policy: *supported
    scripts: { on_correct_reaction: You kept both component parts on the same whole., on_correct_math: '50% of 52 plus 25% of 52 equals 75% of 52.', on_incorrect_attempt_1: Both percentage parts must be calculated from the original whole., on_incorrect_attempt_2: Use 50% of 52 and 25% of 52., worked_explanation: '26 + 13 = 39, so 75% of 52 is 39.' }
    mathematical_support: { hint_1: Do not change the whole after finding the half., hint_2: Both calculations must say “of 52”., worked_solution: '26 + 13 = 39.' }
    success_reaction: { mode: authored }
    visual: { primitive: percentage_strip, model: { percent: 75, wholeAmount: 52, partAmount: 39, partitionCount: 4, selectedGroups: 3, methodSteps: ['50% of 52 = 26', '25% of 52 = 13', '26 + 13 = 39'], solutionLabel: '75% of 52 = 39' } }
    recovery_item_ref: PA-04-R03

  - id: PA-04-C03
