    stage: teaching_checkpoint
    target: Interpret 75% as three quarters.
    prompt: Which statement is correct?
    response: { type: single_choice, options: [75% is found by dividing the whole into three equal groups and selecting one., 75% is found by dividing the whole into four equal groups and selecting three., 25% is found by dividing the whole by 25., 50% is greater than the complete whole.] }
    answer: { value: 75% is found by dividing the whole into four equal groups and selecting three. }
    attempt_policy: &supported { policy: two_attempt_then_targeted_repair, max_attempts_before_resolution: 2, feedback_timing: immediate, submit_label: Check answer, allow_change_before_submit: true, lock_after_final_submit: true }
    scripts: { on_correct_reaction: You kept four equal quarters and selected three., on_correct_math: '75% = 3/4.', on_incorrect_attempt_1: The denominator tells how many equal parts make the whole., on_incorrect_attempt_2: Split the whole into four equal parts and select three., worked_explanation: 'Three selected quarters represent 3/4, which is 75%.' }
    mathematical_support: { hint_1: Which fraction equals 75%?, hint_2: Three quarters means three selected parts out of four., worked_solution: '75% = 3/4.' }
