    mathematical_support: { hint_1: Divide 80 by 4., hint_2: Multiply the one-quarter value by 3., worked_solution: '60' }
    success_reaction: { mode: authored }
    visual: { primitive: percentage_strip, model: { percent: 75, wholeAmount: 80, partAmount: 60, partitionCount: 4, selectedGroups: 3, methodSteps: ['80 ÷ 4 = 20', '20 × 3 = 60'], solutionLabel: '75% of 80 = 60' } }
    recovery_item_ref: PA-04-R02

