    stage: practice
    target: Recognise the quarter method.
    prompt: Which statement is correct?
    response: { type: single_choice, options: [To find 25%, split the whole into four equal parts and select one., To find 25%, split the whole into twenty-five equal parts and select one., To find 75%, divide the whole by 75., To find 50%, multiply the whole by 50.] }
    answer: { value: To find 25%, split the whole into four equal parts and select one. }
    attempt_policy: *supported
    scripts: { on_correct_reaction: You matched twenty-five percent to one quarter., on_correct_math: '25% = 1/4.', on_incorrect_attempt_1: Use the benchmark fraction for twenty-five percent., on_incorrect_attempt_2: Split into four equal parts and select one., worked_explanation: 'One quarter of the whole is 25%.' }
    mathematical_support: { hint_1: Which fraction equals 25%?, hint_2: One quarter has denominator 4., worked_solution: '25% = 1/4.' }
