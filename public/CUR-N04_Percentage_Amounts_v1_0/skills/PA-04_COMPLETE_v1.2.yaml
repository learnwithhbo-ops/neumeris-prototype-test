schema_version: '1.2'
spec_intent:
  source_of_truth: true
  implementation_status: production_batch_1
  source_material: { title: PA 04 — Find 50%, 25% and 75% of an Amount, path: authoring-source-redacted.pdf, authoritative_pages: 1-18 }
  authored_scope: Teach 50%, 25% and 75% as one half, one quarter and three quarters of the same whole.
  excluded_from_active_route: [Diagnostic questions, Delayed retrieval questions, Multiples of 10% and arbitrary percentages]

identity:
  id: PA-04
  slug: find-fifty-twenty-five-and-seventy-five-percent
  title: Find 50%, 25% and 75% of an Amount
  strand: Number
  cluster: Percentage Amounts
  tier: GCSE Foundation
  status: production_batch_1
  estimated_minutes: { min: 18, max: 24 }

curriculum:
  learning_objective: Find 50%, 25% and 75% of a stated amount using the equivalent fractions 1/2, 1/4 and 3/4 and equal parts of the same whole.
  success_criteria: [Find 50% by selecting one of two equal parts., Find 25% by selecting one of four equal parts., Find 75% by selecting three equal quarters or combining 50% and 25% from the same whole., Preserve units and use percentage size to check the result.]
  boundaries:
    includes: [Exactly 50%, 25% and 75% of positive whole-number amounts, Whole-number and simple one-decimal results, Direct calculations and short contexts]
    excludes: [Multiples of 10% and 5%, Arbitrary percentages, Money-specific conventions, Percentage change and reverse percentages]

dependencies:
  required_skill_refs: [PA-01, FDP-03, MD-01, MD-02]
  entry_assumptions: [The learner recognises halves and quarters, The learner can find unit and non-unit fractions of amounts]
  downstream_rule: PA-07 may combine these benchmarks with other percentage parts; PA-04 keeps all parts tied to the same whole.

engine_capability_requirements:
  input_types: [single_choice, decimal]
  visual_primitives: [percentage_strip, caption_layer, progress_indicator]
  animation_actions: [fade_in, highlight, reveal_equation, contrast, crossfade_phase]
  audio_capabilities: [browser_speech, caption_sync, pause_for_input, cancel_on_navigation]
  state_capabilities: [attempt_count, step_resume, exit_score, confirmation_branch]

experience_contract:
  authored_feedback_only: true
  ordered_phases: [teaching, guided, faded, independent_transfer, practice, exit, completion]
  navigation: { default: linear_forward, refresh_resume: Resume at the latest committed step., start_again: Reset only this lesson attempt and preserve historical completion records. }
  interaction_rules: [Never auto-submit or auto-fill an answer., Keep input available while Ryan speaks., Keep every selected half or quarter tied to the original whole.]

voice_and_script:
  performer_name: Ryan
  dialogue_profile_ref: RYAN_DIALOGUE_PROFILE_v1.yaml
  script_ownership: All mathematical narration and feedback is authored in this specification.
  caption_policy: Every spoken line is captioned verbatim; empty narration leaves no visible caption container.
  narration_playback: { mode: browser_speech_ryan, require_ryan_voice: true, browser_voice_name: Microsoft Ryan Online (Natural) - English (United Kingdom), opening_delay_ms: 0 }
  production_audio_note: Provider audio and word boundaries require separate owner permission.

visual_language:
  primary_visual_contract: { primitive: percentage_strip, rule: Use the same complete strip width for halves and quarters; only the number of equal selected parts changes. }
  scene_rules: [Show two equal parts for 50% and four equal parts for 25% and 75%., Keep quarter groups equal in size., Do not reveal a scored result before submission.]
  reduced_motion: Show the completed equal-part comparison without movement.

diagnostic: { enabled: false, question_refs: [], reason: Diagnostic is outside the current implementation scope. }

concept_model:
  core_idea: Fifty percent is one half, twenty-five percent is one quarter and seventy-five percent is three quarters of the same whole.
  invariant: The complete whole and equal-part size stay fixed while the number of selected parts changes.
  mathematical_rule: 50% = 1/2; 25% = 1/4; 75% = 3/4 = 1/2 + 1/4.
  must_notice: [The denominator gives the number of equal parts., Seventy-five percent selects three quarters., Both parts in 50% plus 25% come from the same whole., For a positive whole 25% < 50% < 75% < 100%.]
  common_confusions: [Dividing by 50, 25 or 75., Swapping halves and quarters., Stopping after one quarter for 75%., Combining percentage parts from different wholes.]

lesson:
  teaching_steps:
    - id: T01
      stage: teaching
      purpose: Connect benchmark percentages to familiar fractions.
      estimated_seconds: 40
      scene:
        layout: paired_comparison
        display_title: Familiar fractions of one whole
        objects: [The same whole shown as one half, one quarter and three quarters.]
        initial_state: Keep the complete strip width unchanged across all three models.
        model:
          comparisonDefaults: { showRoles: false, showFormula: false, showResult: true }
          comparisons:
            - { heading: '50% = 1/2', percent: 50, wholeAmount: 36, unit: counters, partAmount: 18, partitionCount: 2, selectedGroups: 1, solutionLabel: 'one of two equal parts' }
            - { heading: '25% = 1/4', percent: 25, wholeAmount: 36, unit: counters, partAmount: 9, partitionCount: 4, selectedGroups: 1, solutionLabel: 'one of four equal parts' }
            - { heading: '75% = 3/4', percent: 75, wholeAmount: 36, unit: counters, partAmount: 27, partitionCount: 4, selectedGroups: 3, solutionLabel: 'three of four equal parts' }
      narration: { script: These three percentages are familiar fractions of the same whole. Fifty percent is one half, twenty-five percent is one quarter, and seventy-five percent is three quarters. }
      animation_timeline: [{ id: A01, trigger: narration_sync, action: contrast, target: percentage_strip, duration_ms: 900 }]
      learner_interaction: { question_ref: null }
      next_step: T02

    - id: T02
      stage: teaching
      purpose: Compare equal groups from the same amount.
      estimated_seconds: 45
      scene:
        layout: paired_comparison
        display_title: The group size stays fixed
        objects: [Thirty-six counters split into four equal groups of nine.]
        initial_state: Select one, two and three unchanged quarter-groups.
        model:
          comparisonDefaults: { showRoles: false, showFormula: false, showResult: true }
          comparisons:
            - { heading: '25%: one group', percent: 25, wholeAmount: 36, unit: counters, partAmount: 9, partitionCount: 4, selectedGroups: 1 }
            - { heading: '50%: two groups', percent: 50, wholeAmount: 36, unit: counters, partAmount: 18, partitionCount: 4, selectedGroups: 2 }
            - { heading: '75%: three groups', percent: 75, wholeAmount: 36, unit: counters, partAmount: 27, partitionCount: 4, selectedGroups: 3 }
      narration: { script: Each row starts with the same thirty-six counters split into four equal groups of nine. Select one group for twenty-five percent, two for fifty percent, and three for seventy-five percent. }
      animation_timeline: [{ id: A02, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 900 }]
      learner_interaction: { question_ref: null }
      next_step: T03

    - id: T03
      stage: teaching
      purpose: Model three quarters of an amount.
      estimated_seconds: 40
      scene:
        layout: single_central_teaching_canvas
        display_title: Find one quarter, then select three
        objects: [A worked example finding 75% of 64.]
        initial_state: Reveal the one-quarter value before the three-quarter result.
        model: { heading: 'Find 75% of 64', percent: 75, wholeAmount: 64, partAmount: 48, partitionCount: 4, selectedGroups: 3, showRoles: true, showResult: true, showMethod: true, methodSteps: ['75% = 3/4', '64 ÷ 4 = 16', '16 × 3 = 48'] }
      narration: { script: Seventy-five percent is three quarters. Divide sixty-four by four to find one quarter, then select three equal quarters. The result is forty-eight. }
      animation_timeline: [{ id: A03, trigger: narration_sync, action: reveal_equation, target: percentage_strip, duration_ms: 850 }]
      learner_interaction: { question_ref: null }
      next_step: T04

    - id: T04
      stage: teaching
      purpose: Show the alternative same-whole route.
      estimated_seconds: 40
      scene:
        layout: single_central_teaching_canvas
        display_title: Fifty percent plus twenty-five percent
        objects: [The same whole of 64 used for both percentage parts.]
        initial_state: Reveal half and quarter values before adding them.
        model: { heading: 'Another route to 75% of 64', percent: 75, wholeAmount: 64, partAmount: 48, partitionCount: 4, selectedGroups: 3, showRoles: true, showResult: true, showMethod: true, methodSteps: ['50% of 64 = 32', '25% of 64 = 16', '32 + 16 = 48'] }
      narration: { script: You can also combine fifty percent and twenty-five percent, but both parts must come from the original whole of sixty-four. Thirty-two plus sixteen is forty-eight. }
      animation_timeline: [{ id: A04, trigger: narration_sync, action: reveal_equation, target: percentage_strip, duration_ms: 850 }]
      learner_interaction: { question_ref: null }
      next_step: T05

    - id: T05
      stage: teaching
      purpose: Check the three-quarter structure.
      estimated_seconds: 70
      scene: { layout: single_central_teaching_canvas, display_title: What does seventy-five percent select?, objects: [Four equal parts with no answer label.], initial_state: Keep the selected-count explanation hidden. }
      narration: { script: Choose the statement that keeps four equal parts and selects the correct number of them. }
      animation_timeline: [{ id: A05, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 650 }]
      learner_interaction: { question_ref: PA-04-C01, auto_focus: true }
      next_step: T06

    - id: T06
      stage: teaching
      purpose: Guide 75% of 52.
      estimated_seconds: 45
      scene:
        layout: single_central_teaching_canvas
        display_title: Keep each quarter equal
        objects: [A guided example finding 75% of 52.]
        initial_state: Reveal one quarter before the final three-quarter value.
        model: { heading: 'Find 75% of 52', percent: 75, wholeAmount: 52, partAmount: 39, partitionCount: 4, selectedGroups: 3, showRoles: true, showResult: true, showMethod: true, methodSteps: ['52 ÷ 4 = 13', '13 × 3 = 39'] }
      narration: { script: Divide fifty-two into four equal quarters. One quarter is thirteen, so three unchanged quarters contain thirty-nine. }
      animation_timeline: [{ id: A06, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 850 }]
      learner_interaction: { question_ref: null }
      next_step: T07

    - id: T07
      stage: teaching
      purpose: Check the alternative route.
      estimated_seconds: 70
      scene: { layout: single_central_teaching_canvas, display_title: Combine parts from the same whole, objects: [A 75% strip for 52 with no method shown.], initial_state: Hide both component values before submission. }
      narration: { script: Choose the alternative method that keeps both percentage parts tied to the original fifty-two. }
      animation_timeline: [{ id: A07, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 650 }]
      learner_interaction: { question_ref: PA-04-C02, auto_focus: true }
      next_step: T08

    - id: T08
      stage: teaching
      purpose: Compare benchmark sizes.
      estimated_seconds: 40
      scene:
        layout: paired_comparison
        display_title: More selected quarters means a larger part
        objects: [The same positive whole with 25%, 50%, 75% and 100% marked.]
        initial_state: Show the benchmark order without changing the whole.
        model:
          comparisonDefaults: { showRoles: false, showFormula: false, showResult: true }
          comparisons:
            - { heading: '25%', percent: 25, wholeAmount: 80, partAmount: 20, partitionCount: 4, selectedGroups: 1 }
            - { heading: '50%', percent: 50, wholeAmount: 80, partAmount: 40, partitionCount: 4, selectedGroups: 2 }
            - { heading: '75%', percent: 75, wholeAmount: 80, partAmount: 60, partitionCount: 4, selectedGroups: 3 }
      narration: { script: Keep the whole fixed. One quarter is smaller than two quarters, and two quarters are smaller than three. So twenty-five percent is below fifty percent, which is below seventy-five percent. }
      animation_timeline: [{ id: A08, trigger: narration_sync, action: contrast, target: percentage_strip, duration_ms: 900 }]
      learner_interaction: { question_ref: null }
      next_step: T09

    - id: T09
      stage: teaching
      purpose: Check a full benchmark calculation.
      estimated_seconds: 75
      scene: { layout: single_central_teaching_canvas, display_title: Select three equal quarters yourself, objects: [A four-part strip for 80.], initial_state: Keep the quarter value and result hidden. }
      narration: { script: Find seventy-five percent of eighty. Enter the final amount yourself. }
      animation_timeline: [{ id: A09, trigger: narration_sync, action: highlight, target: percentage_strip, duration_ms: 650 }]
      learner_interaction: { question_ref: PA-04-C03, auto_focus: true }
      next_step: T10

    - id: T10
      stage: teaching
      purpose: Hand control to the learner.
      estimated_seconds: 25
      scene: { layout: single_central_teaching_canvas, display_title: Match the benchmark to equal parts, objects: [An unsolved quartered whole.], initial_state: Keep only the equal partitions as a cue., model: { heading: 'Your turn', percent: 50, wholeAmount: 86, partitionCount: 2, selectedGroups: 1, showRoles: false, showResult: false } }
      narration: { script: Now choose the matching fraction, use equal parts of the correct whole, and check the result against the benchmark size. }
      animation_timeline: [{ id: A10, trigger: narration_sync, action: crossfade_phase, target: percentage_strip, duration_ms: 700 }]
      learner_interaction: { question_ref: null }
      next_step: G01

  transfer_steps:
    G01: { stage: guided, question_ref: PA-04-G01, support_level: high, estimated_seconds: 80, pre_question_script: Fifty percent selects one of two equal parts., visual_before_answer: Show two equal parts without the result., correct_next: F01, recovery_ref: PA-04-R01 }
    F01: { stage: faded, question_ref: PA-04-F01, support_level: reduced, estimated_seconds: 85, pre_question_script: Twenty-five percent selects one of four equal parts., visual_before_answer: Show four equal parts without the result., correct_next: I01, recovery_ref: PA-04-R01 }
    I01: { stage: independent_transfer, question_ref: PA-04-I01, support_level: none, estimated_seconds: 90, pre_question_script: Select three quarters independently and retain the decimal accurately., visual_before_answer: No quarter value or result is visible., correct_next: P01, recovery_ref: PA-04-R02 }

  practice:
    intro_script: Five questions now. Keep the whole fixed and select the required number of equal halves or quarters.
    question_order: [PA-04-P01, PA-04-P02, PA-04-P03, PA-04-P04, PA-04-P05]
    question_count: 5
    feedback_policy: First errors receive an authored clue; second errors reveal the equal-part method and a focused repair where configured.

  exit:
    intro_script: Final check. Two questions, one submission each, with no hints while you answer.
    primary_question_refs: [PA-04-E01, PA-04-E02]
    confirmation_question_refs: [PA-04-CFM01, PA-04-CFM02]
    submission_policy: One submission per primary exit item; reveal the outcome only after both are complete.
    mastery_logic: { 2_correct_of_2: SECURE, 1_correct_of_2: Ask one unused confirmation item; correct is SECURE and incorrect is NEEDS_WORK., 0_correct_of_2: NEEDS_WORK }
    confirmation_selection: Use the first unseen confirmation item.

completion:
  secure: { title: Skill complete, ryan_script: 'You kept halves and quarters tied to the same whole and selected the correct number of equal parts. These benchmark percentages are ready to use.', state_write: SECURE, buttons: [Finish for today, Continue learning] }
  needs_work: { title: One more pass will help, ryan_script: 'The benchmark fractions are visible. We will revisit how many equal parts are selected before moving on.', state_write: NEEDS_WORK, buttons: [Try this skill again, Finish for today] }

