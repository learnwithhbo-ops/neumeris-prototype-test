    answer: { value: '18' }
    attempt_policy: *supported
    scripts: { on_correct_reaction: You selected one of four equal quarters., on_correct_math: '72 ÷ 4 = 18.', on_incorrect_attempt_1: Twenty-five percent is one quarter., on_incorrect_attempt_2: Divide 72 by 4., worked_explanation: '25% of 72 = 1/4 of 72 = 18.' }
