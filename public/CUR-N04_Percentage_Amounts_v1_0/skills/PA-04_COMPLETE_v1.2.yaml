    target: Find one half.
    prompt: Find 50% of 86.
    response: { type: decimal, input_label: Your answer }
    answer: { value: '43' }
    attempt_policy: *supported
    scripts: { on_correct_reaction: You selected one of two equal halves., on_correct_math: '86 ÷ 2 = 43.', on_incorrect_attempt_1: Fifty percent is one half., on_incorrect_attempt_2: Divide 86 into two equal parts., worked_explanation: '50% of 86 = 1/2 of 86 = 43.' }
    mathematical_support: { hint_1: Use 50% = 1/2., hint_2: Halve 86., worked_solution: '43' }
