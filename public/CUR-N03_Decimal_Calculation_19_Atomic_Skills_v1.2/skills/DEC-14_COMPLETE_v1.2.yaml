  routing: After selected diagnostic skills are scored, start at the earliest non-secure skill in prerequisite order;
    probe external P-N prerequisites only when the response pattern makes that prerequisite plausibly blocking.
concept_model:
  core_idea: Division by an integer partitions a decimal quantity into an exact number of equal groups or measures how
    many equal groups fit.
  invariant: Quotient × divisor must reproduce the dividend exactly for an exact division.
  mathematical_rule: Use place-value division or an equivalent grouping model, continue through decimal places as needed,
    and check by multiplying the quotient by the divisor.
  vocabulary:
  - dividend
  - divisor
  - quotient
  - equal sharing
  - grouping
  - inverse
  must_notice:
  - 8.4 ÷ 4 = 2.1 because 4 × 2.1 = 8.4.
  - The decimal point in the quotient follows place value.
  - A quotient can be below one.
  common_confusions:
  - Drops the decimal point.
  - Divides only the whole-number part.
  - Stops before using remaining decimal places.
