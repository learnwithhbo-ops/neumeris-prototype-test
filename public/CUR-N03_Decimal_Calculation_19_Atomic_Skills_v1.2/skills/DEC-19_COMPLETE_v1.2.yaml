voice_and_script:
  performer_name: Ryan
  dialogue_profile_ref: RYAN_DIALOGUE_PROFILE_v1.yaml
  script_ownership: All lesson-specific mathematical speech is authored exactly in this skill file. Generic encouragement
    is authored exactly in the referenced Ryan dialogue profile. The engine chooses eligible generic reactions; neither
    Codex nor TTS may invent, paraphrase or extend any spoken line.
  delivery_style:
  - Natural UK English
  - Warm, conversational and encouraging
  - Praise understanding, independence or recovery rather than merely announcing correctness
  - No one-word success reactions
  - No repeated praise lead-ins within one lesson attempt
  - Use pauses to let the learner inspect mathematical visuals
  success_reaction_policy:
    mode: engine_select_from_authored_profile
    generation_allowed: false
    selection_state_scope: lesson_attempt
    persist_selection_history_on_refresh_resume: true
    derive_context_from:
    - stage
    - attempt_count
    - recovery_status
    - practice_streak
    no_repeat:
    - reaction_id
    - exact_text
    - lead_family
    fallback_when_pool_exhausted: Speak only the item-specific mathematical follow-up; never repeat or invent praise.
    diagnostic: silent
    exit_and_confirmation: silent_until_completion_result
  adjacent_speech_policy:
    after_success: Do not play a second generic acknowledgement before the next scene.
    next_scene: Begin directly with new mathematical content.
    semantic_echo: The next scene must not restate the mathematical conclusion just delivered in success feedback.
    item_math_feedback: May follow the selected generic reaction only when it adds mathematical value.
  caption_policy: Every spoken line must be captioned verbatim. Captions stay visible long enough to be read and disappear
    before the next unrelated line.
visual_language:
  scene_rules:
    composition: Use one central mathematical representation with one secondary support view only when it clarifies the
      same decimal relationship.
    labels: Keep decimal points, place-value headings, signs and units attached to the quantities they describe.
    motion: Use movement only to expose place value, signed direction, shared scaling, regrouping, grouping or operation
      structure.
    focus: De-emphasise non-essential quantities at each narration beat and highlight only the active mathematical relationship.
  semantic_roles:
  - decimal_point
  - place_value
  - sign
  - active_quantity
  - student_focus
  - error
  - success
  - unit_label
  style_direction:
  - Professional educational vector style
  - Clean geometry and typography
  - High contrast between mathematical roles
  - Multiple relevant semantic colours rather than one monochrome palette
  - No decorative illustrations that compete with the maths
  reduced_motion: Replace physical movement with an equivalent two-state crossfade while preserving all intermediate
    mathematical labels and narration meaning.
diagnostic:
  purpose: Locate whether this atomic skill should be taught; diagnostic distractors are not used to infer a misconception
    type.
  question_refs:
  - DEC-19-D01
  - DEC-19-D02
  presentation: Two isolated items. No hints, worked solutions, correctness reveal or Ryan praise while diagnostic evidence
    is being collected.
  scoring:
    2_of_2: DIAGNOSTIC_SECURE
    0_or_1_of_2: NEEDS_WORK
  routing: After selected diagnostic skills are scored, start at the earliest non-secure skill in prerequisite order;
    probe external P-N prerequisites only when the response pattern makes that prerequisite plausibly blocking.
concept_model:
  core_idea: Multi-step decimal problems require a correct calculation plan before accurate arithmetic can succeed.
  invariant: Each intermediate result must represent the intended quantity and feed the next operation without changing
    its meaning, sign or unit.
  mathematical_rule: Identify the final required quantity, plan the operation sequence, calculate each step without premature
    rounding, and check sign, unit and reasonableness at the end.
  vocabulary:
  - multi-step
  - intermediate result
  - operation sequence
  - reasonableness
  - unit
  - plan
  must_notice:
  - A correct first step is not enough if the question requires another operation.
  - Operation order comes from the quantity relationships, not keywords.
  - An unreasonable final value can reveal an earlier decimal or operation error.
  common_confusions:
  - Stops after one step.
  - Chooses operations from keywords.
  - Uses correct operations in the wrong order.
  - Drops units or signs.
  - Does not reject an unreasonable answer.
