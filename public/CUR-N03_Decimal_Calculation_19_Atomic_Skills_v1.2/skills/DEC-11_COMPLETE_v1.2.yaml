  routing: After selected diagnostic skills are scored, start at the earliest non-secure skill in prerequisite order;
    probe external P-N prerequisites only when the response pattern makes that prerequisite plausibly blocking.
concept_model:
  core_idea: Multiplying a decimal by an integer combines a whole number of equal decimal-sized groups.
  invariant: The decimal factor is repeated exactly the stated integer number of times; its place-value scale remains
    consistent.
  mathematical_rule: Multiply the integer-valued digits accurately, preserve the decimal scale of the decimal factor,
    and check by repeated groups or estimation.
  vocabulary:
  - factor
  - product
  - repeated groups
  - place value
  - scale
  must_notice:
  - 1.7 × 4 means four groups of 1.7.
  - The product may cross a whole-number boundary.
  - The decimal point is not placed by visual alignment.
  common_confusions:
  - Multiplies only digits after the decimal point.
  - Guesses the decimal position.
  - Assumes the product must have the same number of digits as the factor.
