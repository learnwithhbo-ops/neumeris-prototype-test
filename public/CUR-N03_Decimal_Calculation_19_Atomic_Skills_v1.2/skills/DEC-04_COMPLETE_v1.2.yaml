concept_model:
  core_idea: 'Signed decimal order follows the number line: farther right is always greater, while decimal place value
    determines precise magnitude.'
  invariant: For negative values, greater magnitude means a smaller number; the ordering direction of the number line
    never changes.
  mathematical_rule: Separate values by sign, use the number line for negative direction, and use aligned decimal place
    value to compare magnitudes precisely.
  vocabulary:
  - negative
  - positive
  - zero
  - magnitude
  - greater than
  - less than
  - number line
  must_notice:
  - -0.4 is greater than -0.6 because it is closer to zero.
  - All negative values are less than zero and all positive values are greater than zero.
  - Place-value padding still works for negative decimals.
  common_confusions:
  - Orders negative decimals exactly like positive decimals.
  - Ignores the negative sign.
  - Assumes the larger magnitude is the greater signed value.
