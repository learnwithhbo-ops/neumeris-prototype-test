concept_model:
  core_idea: A number line represents equal numerical intervals, so the value of a tick is found from the interval size
    and starting value.
  invariant: Equal visual spacing represents equal numerical change along a correctly scaled number line.
  mathematical_rule: Find the difference between labelled values, divide by the number of intervals, then count that
    interval size from a known label.
  vocabulary:
  - number line
  - interval
  - tick mark
  - scale
  - interpolate
  - endpoint
  must_notice:
  - Count spaces between ticks, not the number of tick marks.
  - A scale does not always increase by 0.1.
  - The first visible tick does not have to represent zero.
  common_confusions:
  - Counts tick marks instead of intervals.
  - Assumes every decimal number line uses tenths.
  - Starts counting from zero instead of the labelled endpoint.
