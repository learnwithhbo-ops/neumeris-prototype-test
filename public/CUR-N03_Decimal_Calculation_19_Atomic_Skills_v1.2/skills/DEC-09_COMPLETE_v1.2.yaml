visual_language:
  scene_rules:
    composition: Use one central mathematical representation with one secondary support view only when it clarifies the
      same decimal relationship.
    labels: Keep decimal points, place-value headings, signs and units attached to the quantities they describe.
    motion: Use movement only to expose place value, signed direction, shared scaling, regrouping, grouping or operation
      structure.
    focus: De-emphasise non-essential quantities at each narration beat and highlight only the active mathematical relationship.
  semantic_roles:
  - decimal_point
  - place_value
  - sign
  - active_quantity
  - student_focus
  - error
  - success
  - unit_label
  style_direction:
  - Professional educational vector style
  - Clean geometry and typography
  - High contrast between mathematical roles
  - Multiple relevant semantic colours rather than one monochrome palette
  - No decorative illustrations that compete with the maths
  reduced_motion: Replace physical movement with an equivalent two-state crossfade while preserving all intermediate
    mathematical labels and narration meaning.
