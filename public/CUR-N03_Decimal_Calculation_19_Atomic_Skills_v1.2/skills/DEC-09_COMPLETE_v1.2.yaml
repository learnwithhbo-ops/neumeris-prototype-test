  - DEC-09-D02
  presentation: Two isolated items. No hints, worked solutions, correctness reveal or Ryan praise while diagnostic evidence
    is being collected.
  scoring:
    2_of_2: DIAGNOSTIC_SECURE
    0_or_1_of_2: NEEDS_WORK
  routing: After selected diagnostic skills are scored, start at the earliest non-secure skill in prerequisite order;
    probe external P-N prerequisites only when the response pattern makes that prerequisite plausibly blocking.
concept_model:
  core_idea: A contextual decimal calculation begins by identifying the relationship between quantities, not by reacting
    to a keyword.
  invariant: The meaning and unit of each quantity must stay consistent through every arithmetic step.
  mathematical_rule: Label the known quantities and required quantity, choose addition for combining and subtraction
    for ordered difference/change, calculate, then check sign and unit.
  vocabulary:
  - total
  - difference
  - remaining
  - change
  - balance
  - unit
  must_notice:
  - “Change” can mean a signed difference, not automatically subtraction of smaller from larger.
  - Compatible units must be kept through the calculation.
  - The final sign can carry contextual meaning such as debt or temperature.
  common_confusions:
  - Chooses an operation from one keyword alone.
  - Drops a negative sign in context.
  - Calculates correctly but answers with the wrong quantity or unit.
