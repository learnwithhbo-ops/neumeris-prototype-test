    - DEC-16
    - DEC-17
    P-N13:
    - DEC-04
    - DEC-07
    - DEC-08
    - DEC-18
    P-N20:
    - embedded checking within DEC-12 and DEC-19; not duplicated as a separate DEC skill
  stage2_rule: If a P-N contract remains canonical, relevant DEC skills should be aliases/package views or explicit deeper
    decompositions with migration, never duplicate mastery nodes.
