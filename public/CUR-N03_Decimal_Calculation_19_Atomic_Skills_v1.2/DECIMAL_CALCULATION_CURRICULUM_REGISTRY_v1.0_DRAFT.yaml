  - Negative plus positive.
  - Negative plus negative.
  - Crossing zero.
  excludes:
  - Subtraction notation as the main target.
  - Signed multiplication or division.
  - Algebraic simplification.
  misconception_focus:
  - Always adds magnitudes and makes the result positive.
