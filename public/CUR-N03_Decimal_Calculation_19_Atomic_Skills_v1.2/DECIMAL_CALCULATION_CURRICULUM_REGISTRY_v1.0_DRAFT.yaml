registry: Revily Decimal Calculation Curriculum Registry
version: 1.0 - Count-Blind Draft for Owner Approval
package_id: CUR-N03
status: Complete proposed curriculum contract; atomicity re-audited without a target skill count; not yet owner-approved
  or real-student calibrated.
authority_hierarchy:
- Owner-approved CUR-N03 registry and machine-readable export.
- Approved individual DEC skill package where compatible.
- Shared Revily v1.2 schema and teaching standards.
- Number Fundamentals P-N registry for prerequisites and ownership resolution.
- Stage 1 S1-NUM macro rows as migration evidence, not competing production skills.
atomicity_rule: One atomic skill represents one independently diagnosable learner action, one mastery decision and one
  primary repair destination. Different difficulty levels of the same method are not split merely to increase skill count.
count_blind_result:
  final_atomic_skill_count: 19
  previous_target-shaped_draft_count: 28
  decision: The 28-skill draft is superseded by this 19-skill boundary model.
  reason: Nine apparent splits were merged or removed because they shared the same central misconception/repair destination;
    one genuine missing signed multiplication/division capability was added.
scope_exclusions:
- 'Fractions-decimals-percentages conversion: CUR-N04.'
- Percentage calculations and percentage change.
- Rounding and formal accuracy/error intervals.
- Ratio, rates and compound measures when those are the actual target.
- Standard form.
- Recurring-decimal theory beyond terminating quotient calculation.
phases:
- phase: A
  purpose: Decimal meaning, positive comparison and signed ordering
  skills:
  - DEC-01
  - DEC-02
  - DEC-03
  - DEC-04
- phase: B
  purpose: Addition and subtraction, including signed decimals and contexts
  skills:
  - DEC-05
  - DEC-06
  - DEC-07
  - DEC-08
  - DEC-09
- phase: C
  purpose: Powers of ten and decimal multiplication
  skills:
  - DEC-10
  - DEC-11
  - DEC-12
  - DEC-13
- phase: D
  purpose: Decimal division
  skills:
  - DEC-14
  - DEC-15
  - DEC-16
  - DEC-17
- phase: E
  purpose: Signed multiplicative operations and mixed application
  skills:
  - DEC-18
  - DEC-19
skills:
- id: DEC-01
  title: Read, Write and Partition Decimals
  status: PROPOSED
  learning_objective: Read, write, construct and partition non-negative decimals to thousandths using base-ten place
    value and zero placeholders.
  prerequisites:
  - P-N09
  includes:
  - Tenths, hundredths and thousandths.
  - Standard, verbal, expanded and place-value forms.
  - Zero placeholders inside decimal notation.
  - Partitioning a decimal into place-value components.
  excludes:
  - Comparing or ordering as the main target.
  - Negative decimals.
  - Rounding.
  - Fraction-decimal conversion.
  - Decimal arithmetic.
  misconception_focus:
  - Reads decimal digits as a whole-number string.
  - Drops required zero placeholders.
  - Confuses tenths, hundredths and thousandths.
  ownership_review:
    overlap_or_alias_candidates:
    - P-N14
    derived_from_prior_decimal_draft:
    - DEC-01
    - DEC-02
    - DEC-03
  mastery_rule: 'Shared v1.2 exit: two silent primary items; 2/2 secure, 1/2 one confirmation item, 0/2 needs work. Threshold
    remains calibration-sensitive.'
- id: DEC-02
  title: Compare and Order Positive Decimals
  status: PROPOSED
  learning_objective: Compare and order non-negative decimals to thousandths by aligning place values and recognising
    equivalent trailing-zero notation.
  prerequisites:
  - DEC-01
  includes:
  - Comparison using <, > and =.
  - Equivalent notation such as 4.7 = 4.70.
  - Ordering three or more positive decimals.
  - Unequal numbers of decimal places.
  excludes:
  - Negative decimals.
  - Rounding as a comparison method.
  - Mixed fraction/percentage lists.
  - Arithmetic.
  misconception_focus:
  - Treats the decimal with more written digits as larger.
  - Compares decimal digits as whole numbers.
  - Reverses < and > or sorts a list inconsistently.
  ownership_review:
    overlap_or_alias_candidates:
    - P-N14
    derived_from_prior_decimal_draft:
    - DEC-04
    - DEC-05
    - DEC-06
  mastery_rule: 'Shared v1.2 exit: two silent primary items; 2/2 secure, 1/2 one confirmation item, 0/2 needs work. Threshold
    remains calibration-sensitive.'
- id: DEC-03
  title: Locate and Interpolate Decimals on a Number Line
  status: PROPOSED
  learning_objective: Read, locate and interpolate non-negative decimals on number lines with equal intervals of tenths,
    hundredths or thousandths.
  prerequisites:
  - DEC-01
  includes:
  - Reading labelled decimal number lines.
  - Counting intervals rather than tick marks.
  - Missing labels between consecutive tenths or hundredths.
  - Interval sizes of 0.1, 0.01 and 0.001.
  excludes:
  - Negative number lines as the main target.
  - Coordinate geometry.
  - Rounding.
  - Arithmetic.
  misconception_focus:
  - Counts tick marks instead of intervals.
  - Assumes every decimal number line uses tenths.
  - Starts counting from zero instead of the labelled endpoint.
  ownership_review:
    overlap_or_alias_candidates:
    - P-N14
    derived_from_prior_decimal_draft:
    - DEC-07
  mastery_rule: 'Shared v1.2 exit: two silent primary items; 2/2 secure, 1/2 one confirmation item, 0/2 needs work. Threshold
    remains calibration-sensitive.'
- id: DEC-04
  title: Compare and Order Signed Decimals
  status: PROPOSED
  learning_objective: Compare and order positive and negative decimals by combining decimal place value with direction
    and magnitude on the number line.
  prerequisites:
  - DEC-02
  - DEC-03
  - P-N13
  includes:
  - Negative decimals to thousandths.
  - Mixed positive, zero and negative lists.
  - Comparison symbols and ordering.
  - Simple temperature and balance interpretations.
  excludes:
  - Signed decimal arithmetic as the main target.
  - Absolute-value notation as a separate skill.
  - Rounding.
  misconception_focus:
  - Orders negative decimals exactly like positive decimals.
  - Ignores the negative sign.
  - Assumes the larger magnitude is the greater signed value.
  ownership_review:
    overlap_or_alias_candidates:
    - P-N13
    - P-N14
    derived_from_prior_decimal_draft:
    - DEC-08
  mastery_rule: 'Shared v1.2 exit: two silent primary items; 2/2 secure, 1/2 one confirmation item, 0/2 needs work. Threshold
    remains calibration-sensitive.'
- id: DEC-05
  title: Add Positive Decimals
  status: PROPOSED
  learning_objective: Add non-negative decimals accurately, including unequal numbers of decimal places, by aligning
    place value and regrouping when needed.
  prerequisites:
  - DEC-01
  - P-N10
  includes:
  - Same and unequal numbers of decimal places.
  - Padding with equivalent trailing zeros.
  - Regrouping across decimal places.
  - Mental and written place-value checks.
  excludes:
  - Negative addends.
  - Subtraction as the main target.
  - Rounding.
  - Multi-operation contexts.
  misconception_focus:
  - Aligns final digits rather than decimal points.
  - Moves a decimal point to make written lengths match.
  - Loses a carried value across the decimal point.
  ownership_review:
    overlap_or_alias_candidates:
    - P-N16
    derived_from_prior_decimal_draft:
    - DEC-09
    - DEC-10
  mastery_rule: 'Shared v1.2 exit: two silent primary items; 2/2 secure, 1/2 one confirmation item, 0/2 needs work. Threshold
    remains calibration-sensitive.'
- id: DEC-06
  title: Subtract Positive Decimals
  status: PROPOSED
  learning_objective: Subtract non-negative decimals accurately, including unequal decimal places and regrouping across
    zeros, when the final result is non-negative.
  prerequisites:
  - DEC-01
  - P-N10
  includes:
  - Subtraction with and without regrouping.
  - Unequal decimal places.
  - Regrouping across tenths, hundredths and thousandths.
  - Inverse checking.
  excludes:
  - Negative final answers.
  - Subtracting a negative.
  - Rounding.
  - Multi-operation contexts.
  misconception_focus:
  - Subtracts smaller digit from larger digit in each column regardless of order.
  - Regroups across the decimal point incorrectly.
  - Drops placeholder zeros or changes the decimal position.
  ownership_review:
    overlap_or_alias_candidates:
    - P-N16
    derived_from_prior_decimal_draft:
    - DEC-11
    - DEC-12
  mastery_rule: 'Shared v1.2 exit: two silent primary items; 2/2 secure, 1/2 one confirmation item, 0/2 needs work. Threshold
    remains calibration-sensitive.'
- id: DEC-07
  title: Add Signed Decimals
  status: PROPOSED
  learning_objective: Add positive and negative decimals by combining sign, direction and magnitude consistently.
  prerequisites:
  - DEC-04
  - DEC-05
  - P-N13
  includes:
