shared_contract:
  standard_journey:
  - Quick diagnostic evidence
  - Concept teaching
  - Guided transfer
  - Faded transfer
  - Independent transfer
  - Five-question practice
  - Silent exit
  - Targeted recovery when needed
  - Completion
  feedback: 'First wrong: focused hint and retry. Second wrong: clearer cue/critical step plus worked explanation. Supported
    work is learning evidence, not independent mastery evidence.'
  routing: Prerequisite repair preserves the true origin and returns once sufficient evidence is collected.
  retrieval: Delayed retrieval remains a shared pathway/engine concern; this pack does not create a second skill-specific
    scheduler.
approval_checklist:
- Approve the 19 count-blind skill boundaries.
- Resolve aliases/ownership with P-N13 through P-N18 and P-N20.
- Approve DEC as the permanent namespace or define explicit migration.
- Approve numerical limits and accepted answer forms.
- Human-review curriculum, Ryan scripts and animation storyboards.
- Run desktop/mobile rendering, keyboard and reduced-motion tests.
- Calibrate diagnostic/mastery thresholds with real learners before production promotion.
