  "concept_model": {
    "core_idea": "A reciprocal is the multiplicative partner that makes one.",
    "invariant": "The original number multiplied by its reciprocal equals one; the reciprocal is not generally equal to the original number.",
    "mathematical_rule": "For a positive fraction, exchange numerator and denominator. Write a whole number over one first.",
    "must_notice": [
      "Both positions exchange.",
      "Writing a whole number over one preserves its value; taking its reciprocal usually changes it.",
      "One is its own reciprocal.",
      "Zero cannot have a multiplicative partner that gives one."
    ],
    "common_confusions": [
      "Leaving a fraction unchanged",
      "Changing only one position",
      "Keeping a whole number as its own reciprocal",
      "Changing the sign or subtracting",
      "Treating one over zero as a valid number"
    ]
  },
