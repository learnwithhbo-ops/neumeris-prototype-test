  "concept_model": {
    "core_idea": "A mixed number must first become one equivalent improper fraction; then fraction division keeps the first value and uses the divisor’s reciprocal.",
    "invariant": "Conversion preserves each quantity, and only the divisor is reciprocated in the division step.",
    "mathematical_rule": "Convert every mixed number, keep the first fraction, change division to multiplication, reciprocate the second fraction, then multiply and simplify.",
    "must_notice": [
      "The whole-number contribution belongs in the improper numerator.",
      "Both mixed numbers are converted before the operation changes.",
      "The first converted fraction remains the starting amount.",
      "Only the divisor is reciprocated.",
      "Equivalent simplest improper and mixed forms represent the same exact value unless a form is specified."
    ],
    "common_confusions": [
      "Omitting the whole-number contribution",
      "Changing the denominator during conversion",
      "Reciprocating the dividend",
      "Multiplying by the unreciprocated divisor",
      "Simplifying to a non-equivalent value"
    ]
  },
