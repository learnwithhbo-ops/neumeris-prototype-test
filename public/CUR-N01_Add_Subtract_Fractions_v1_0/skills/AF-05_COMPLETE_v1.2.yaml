    "invariant": "Renaming one fraction changes its notation but not its amount; once the denominators match, the common denominator remains fixed.",
    "mathematical_rule": "Use the larger denominator; rename the fraction with the smaller denominator; add the numerators; keep the common denominator.",
    "must_notice": [
      "Only one fraction needs rewriting.",
      "The numerator and denominator use the same scale factor.",
      "Denominators are not added after conversion."
    ],
    "common_confusions": [
      "Changing the denominator but not the numerator",
      "Using unequal scale factors",
      "Adding denominators after conversion",
      "Adding the original numerators over the larger denominator"
    ]
  },
