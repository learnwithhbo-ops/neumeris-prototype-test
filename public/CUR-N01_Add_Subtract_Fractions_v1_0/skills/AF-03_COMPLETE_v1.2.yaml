  "concept_model": {
    "core_idea": "Rename the same fraction with fewer, larger equal parts by dividing both counts by one common factor.",
    "invariant": "Using the same non-zero divisor on the numerator and denominator preserves the value.",
    "mathematical_rule": "Find a common factor; divide both parts by it; repeat until the only common factor is 1.",
    "must_notice": [
      "An equivalent fraction may still not be simplest.",
      "The same divisor must be used for both parts.",
      "A fraction already in simplest form stays unchanged."
    ],
    "common_confusions": [
      "Stopping at a partly simplified fraction",
      "Changing one part only",
      "Using different divisors",
      "Adding or subtracting a factor"
    ]
  },
