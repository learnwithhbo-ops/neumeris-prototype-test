  "concept_model": {
    "core_idea": "The lowest common denominator is the smallest positive multiple shared by the two denominators.",
    "invariant": "A valid common denominator is divisible by both original denominators; the lowest one is the first positive shared value.",
    "mathematical_rule": "Compare the denominators, list their positive multiples, and choose the first shared value.",
    "must_notice": [
      "Numerators do not determine the common denominator.",
      "More than one common denominator can be valid.",
      "A product may be common without being lowest.",
      "The larger denominator works only if it is a multiple of the smaller."
    ],
    "common_confusions": [
      "Common but not lowest",
      "Always choosing the product",
      "Always choosing the larger denominator",
      "Inaccurate multiples",
      "Using numerators"
    ]
  },
