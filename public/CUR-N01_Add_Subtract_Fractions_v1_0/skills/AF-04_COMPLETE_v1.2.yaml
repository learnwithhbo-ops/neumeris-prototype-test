  "concept_model": {
    "core_idea": "Equivalent fractions name the same proportion using a different number of equal parts.",
    "invariant": "The represented proportion stays fixed when both fraction parts use the same scale factor.",
    "mathematical_rule": "Find the scale factor from the known pair; apply it to the other part; check that both fractions have equal value.",
    "must_notice": [
      "A change to one part requires the same multiplicative change to the other.",
      "The missing value may be a numerator or denominator.",
      "Adding the same amount to both parts does not preserve the fraction."
    ],
    "common_confusions": [
      "Changing only one part",
      "Adding instead of multiplying",
      "Using different factors",
      "Selecting a visually similar but non-equivalent fraction"
    ]
  },
